er","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"d8","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"7 处球员重叠：第 1 步 3+C（相距 59）；第 2 步 2+B（相距 55）；第 2 步 3+C（相距 59）；第 2 步 4+D（相距 59）；第 3 步 2+B（相距 55）；第 3 步 3+C（相距 59）；第 3 步 4+D（相距 59）"}]},{"sport":"soccer","id":"overload_6v4","name":"Overload possession 6v4","nameZh":"以多打少控球 6v4","note":"Setup: 6 v 4, 4 cones, ball with 1.\nBall path: 1 → 2 → 3 → 4\nSequence: Step 1: 1 passes to 2, 1 moves back, 3 moves left, 5, C moves right, A moves up the board; Step 2: 2 passes to 3, 2 moves left, 4, B moves up the board, 6 moves right, D moves back; Step 3: 3 passes to 4.\nCoaching point: The extra player has to be findable. Stand where a pass can reach you, not where you'd like the ball to be.","noteZh":"【组织】6 对 4，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 3 → 4\n【流程】第1步：1号球员把球传给2号球员，1号球员回撤移动，3号球员向左移动，5号球员、C向右移动，A向前移动；第2步：2号球员把球传给3号球员，2号球员向左移动，4号球员、B向前移动，6号球员向右移动，D回撤移动；第3步：3号球员把球传给4号球员。\n【要点】多出来的那个人必须是能找得到的。站在传得到你的位置，不是你希望球在的位置。","mistake":"The spare man hides behind a defender — an overload you cannot pass to is arithmetic, not football.","mistakeZh":"多出来的人藏在防守身后——传不到的多打少只是算术，不是足球。","category":"possession","level":"development","minutes":15,"players":10,"family":{"en":"Overload possession","en-GB":"Overload possession","es-ES":"Posesión en superioridad","fr-FR":"Conservation en surnombre","id-ID":"Penguasaan dengan keunggulan","ja-JP":"数的優位のポゼッション","ko-KR":"수적 우위 점유","ms-MY":"Penguasaan lebihan","th-TH":"ครองบอลแบบได้เปรียบจำนวน","vi-VN":"Giữ bóng hơn người","zh-CN":"以多打少控球","zh-TW":"以多打少控球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"6","m":"none"},{"id":"d6","k":"player","l":"A","m":"none"},{"id":"d7","k":"player","l":"B","m":"none"},{"id":"d8","k":"player","l":"C","m":"none"},{"id":"d9","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"5 处球员重叠：第 1 步 3+C（相距 56）；第 2 步 2+B（相距 56）；第 2 步 3+C（相距 56）；第 3 步 2+B（相距 56）；第 3 步 3+C（相距 56）"}]},{"sport":"soccer","id":"defend_offside_line","name":"Holding the offside line","nameZh":"保持越位线","note":"Setup: 6 v 3.\nBall path: 9\nSequence: Step 1: the ball is played to 9, the whole team moves up the board, 9, 11, 10 moves back.\nCoaching point: Step out on the ball going backwards, not on a shout. The line is only as high as its deepest defender.","noteZh":"【组织】6 对 3。\n【球路】9\n【流程】第1步：球被传给9号球员，全队向前压上，9号球员、11号球员、10号球员回撤移动。\n【要点】球往回传的那一刻整条线一起上，不要等谁喊。防线的高度由站得最深的那个人决定。","mistake":"One defender a step late — he plays the whole line onside and nobody else's timing mattered.","mistakeZh":"有一个人慢了半步——整条线的越位就全废了，其他人跑得再准也没用。","category":"defending","level":"advanced","minutes":12,"players":9,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"3","m":"none"},{"id":"d1","k":"player","l":"5","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"2","m":"none"},{"id":"d4","k":"player","l":"6","m":"none"},{"id":"d5","k":"player","l":"GK","m":"none"},{"id":"d6","k":"player","l":"9","m":"none"},{"id":"d7","k":"player","l":"11","m":"none"},{"id":"d8","k":"player","l":"10","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_the_cross","name":"Defending the cross","nameZh":"防守传中","note":"Setup: 5 v 3.\nBall path: 9\nSequence: Step 1: the ball is played to 9, GK moves back, 5, 4, 3, 6, 7, 9, 11 moves up the board.\nCoaching point: The first defender attacks the ball, the second covers the cutback. Defend the space in front of the goal, not the man behind you.","noteZh":"【组织】5 对 3。\n【球路】9\n【流程】第1步：球被传给9号球员，GK回撤移动，5号球员、4号球员、3号球员、6号球员、7号球员、9号球员、11号球员向前移动。\n【要点】第一个人去争球，第二个人补倒三角。守门前那片空间，不是守你身后那个人。","mistake":"Ball-watching on the edge of the six-yard box — the runner you cannot see is the one who scores.","mistakeZh":"盯着球看，站在小禁区边上——你看不见的那个插上的人，就是进球的那个。","category":"defending","level":"development","minutes":12,"players":8,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"GK","m":"none"},{"id":"d1","k":"player","l":"5","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"6","m":"none"},{"id":"d5","k":"player","l":"7","m":"none"},{"id":"d6","k":"player","l":"9","m":"none"},{"id":"d7","k":"player","l":"11","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 GK+5（相距 57）"}]},{"sport":"soccer","id":"defend_throw_in","name":"Defending the throw-in","nameZh":"防守界外球","note":"Setup: 4 v 3.\nBall path: B\nSequence: Step 1: the ball is played to B, 2, 6, 5, C moves up the board, 4 moves right, B moves back.\nCoaching point: Take the short options away first. The throw you can head is the one you want them to make.","noteZh":"【组织】4 对 3。\n【球路】B\n【流程】第1步：球被传给B，2号球员、6号球员、5号球员、C向前移动，4号球员向右移动，B回撤移动。\n【要点】先把近距离的接应点全部封死。你希望对方扔的，是那个你能顶到的长球。","mistake":"The whole side drifts to the ball and nobody picks up the man peeling off behind them.","mistakeZh":"全队都往球那边挪，没人管从身后绕出去的那个人。","category":"defending","level":"development","minutes":10,"players":7,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"2","m":"none"},{"id":"d1","k":"player","l":"6","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"d6","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_rest_defence","name":"Rest defence","nameZh":"进攻时的余量防守","note":"Setup: 6 v 3, ball with 10.\nBall path: 10 → A\nSequence: Step 1: the whole team moves up the board; Step 2: 10 passes to A, A, B, C moves back.\nCoaching point: Three stay while the rest attack, and they stand where the counter would come, not where the ball is. Their job starts the second it is lost.","noteZh":"【组织】6 对 3，球在 10 脚下。\n【球路】10 → A\n【流程】第1步：全队向前压上；第2步：10号球员把球传给A，A、B、C回撤移动。\n【要点】进攻时留三个人，他们要站在对方反击会走的那条路上，不是站在球边。丢球那一秒，他们的活才开始。","mistake":"Everyone joins the attack, so the counter starts 3v2 and nobody is even close enough to foul.","mistakeZh":"所有人都压上去了，对方一反击就是 3 打 2，连个能上去犯规的人都够不着。","category":"defending","level":"advanced","minutes":12,"players":9,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"4","m":"none"},{"id":"d2","k":"player","l":"6","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"10","m":"none"},{"id":"d5","k":"player","l":"7","m":"none"},{"id":"d6","k":"player","l":"A","m":"none"},{"id":"d7","k":"player","l":"B","m":"none"},{"id":"d8","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 10+A（相距 32）；第 2 步 5+4（相距 52）"}]},{"sport":"soccer","id":"press_trap_touchline","name":"Pressing trap: the touchline","nameZh":"边线压迫陷阱","note":"Setup: 5 v 3.\nBall path: A\nSequence: Step 1: the ball is played to A, 9 moves right, A moves back; Step 2: 7, 2 moves up the board, 8, 6 moves right.\nCoaching point: Show him down the line, then squeeze. The touchline is the extra defender — press from outside in and you open the switch you were trying to stop.","noteZh":"【组织】5 对 3。\n【球路】A\n【流程】第1步：球被传给A，9号球员向右移动，A回撤移动；第2步：7号球员、2号球员向前移动，8号球员、6号球员向右移动。\n【要点】先把他往边线赶，再收网。边线就是多出来的一个防守人——如果你从外往里压，正好放开了你想封的那记转移。","mistake":"Pressing from outside in, which opens the switch the trap was built to stop.","mistakeZh":"从外往里压，正好把这个陷阱本来要封死的那记转移让了出来。","category":"defending","level":"advanced","minutes":12,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"9","m":"none"},{"id":"d1","k":"player","l":"7","m":"none"},{"id":"d2","k":"player","l":"8","m":"none"},{"id":"d3","k":"player","l":"6","m":"none"},{"id":"d4","k":"player","l":"2","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 7+A（相距 32）"}]},{"sport":"soccer","id":"finish_long_range","name":"Shooting from distance","nameZh":"远射","note":"Setup: 3 v 1, 2 cones, ball with 8.\nBall path: 8 → goal\nSequence: Step 1: 8 shoots, 8, 10, 6 moves up the board, GK moves back.\nCoaching point: Set the ball across your body first, then hit through the middle of it. On target from 25 yards beats perfect over the bar.","noteZh":"【组织】3 对 1，2 个锥标，球在 8 脚下。\n【球路】8 → 球门\n【流程】第1步：8号球员起脚射门，8号球员、10号球员、6号球员向前移动，GK回撤移动。\n【要点】先把球横着趟到身体外侧，再从球的正中间打透。25 码打正门框，比打得漂亮却飞了要值钱。","mistake":"Leaning back over the ball — a shot hit that way clears the bar every time.","mistakeZh":"打的时候身体后仰——这样打出来的球，每次都从横梁上飞过去。","category":"finishing","level":"foundation","minutes":10,"players":4,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"8","m":"none"},{"id":"d1","k":"player","l":"10","m":"none"},{"id":"d2","k":"player","l":"6","m":"none"},{"id":"d3","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"finish_second_ball_box","name":"Second ball in the box","nameZh":"禁区补射","note":"Setup: 4 v 1, ball with 8.\nBall path: 8 → the open spot → 9 → goal\nSequence: Step 1: 8 plays the ball on, 8 moves up the board; Step 2: the ball is played to 9, 11, 7, 9 moves up the board, GK moves back; Step 3: 9 shoots.\nCoaching point: Follow every shot in. Half a yard from the keeper's parry is the easiest goal in football, and nobody is standing there.","noteZh":"【组织】4 对 1，球在 8 脚下。\n【球路】8 → 空位 → 9 → 球门\n【流程】第1步：8号球员把球传到下一个点，8号球员向前移动；第2步：球被传给9号球员，11号球员、7号球员、9号球员向前移动，GK回撤移动；第3步：9号球员起脚射门。\n【要点】每一脚射门都跟进。门将脱手后半米的那个球，是足球里最好进的球，而通常那里没人。","mistake":"Admiring the shot instead of following it — the rebound is gone before anyone moves.","mistakeZh":"射完站着欣赏，没有跟进——补射的球早被人拿走了，你才刚要动。","category":"finishing","level":"development","minutes":10,"players":5,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"8","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"9","m":"none"},{"id":"d4","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"setpiece_kickoff","name":"Kick-off routine","nameZh":"开球战术","note":"Setup: 5 v 3, ball with 10.\nBall path: 10 → 6 → 9\nSequence: Step 1: 10 passes to 6, 10 moves back, 9 moves up the board; Step 2: 6 passes to 9, 11, 7, 6 moves up the board.\nCoaching point: Two passes decided before the whistle: long into the corner and press, or keep it and settle. Deciding at the ball gives it straight back.","noteZh":"【组织】5 对 3，球在 10 脚下。\n【球路】10 → 6 → 9\n【流程】第1步：10号球员把球传给6号球员，10号球员回撤移动，9号球员向前移动；第2步：6号球员把球传给9号球员，11号球员、7号球员、6号球员向前移动。\n【要点】开球前就定好前两脚：要么直接大脚打角旗区然后压上，要么控住把节奏落下来。站在球边才决定，等于把球还给对方。","mistake":"Improvising the one moment that was rehearsed, and handing the ball straight back.","mistakeZh":"唯一排练过的那一下临场发挥，结果直接把球还给了对方。","category":"setpiece","level":"development","minutes":8,"players":8,"family":"","tags":[], xt.","mistakeZh":"旋转不变地回球——削球原样回去，下一板打得更重。","category":"defending","level":"advanced","minutes":10,"players":2,"family":{"en":"Defending","en-GB":"Defending","es-ES":"Defensa","fr-FR":"Défense","id-ID":"Bertahan","ja-JP":"ディフェンス","ko-KR":"수비","ms-MY":"Pertahanan","th-TH":"การรับ","vi-VN":"Phòng thủ","zh-CN":"防守","zh-TW":"防守"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tableTennis","id":"tt_serve_short_backspin","name":"Serve short backspin","nameZh":"发球 短下旋","note":"Setup: 1 v 1, ball with S.\nBall path: S → R → S\nSequence: Step 1: S plays it to R; Step 2: R plays it to S, S moves right; Step 3: R moves back.\nCoaching point: Serve to set up the third ball you already know you want to play. A great serve with no plan behind it wins one point by accident.","noteZh":"【组织】1 对 1，球在 S 脚下。\n【球路】S → R → S\n【流程】第1步：S 打向 R；第2步：R 打向 S，S向右移动；第3步：R回撤移动。\n【要点】发球是为了铺垫你早就想好的第三板。没有后续计划的好发球，只能靠运气赢一分。","mistake":"Serving without a planned third ball — a great serve with no plan wins one point by luck.","mistakeZh":"发球没想好第三板——没计划的好发球只能靠运气赢一分。","category":"setpiece","level":"development","minutes":8,"players":2,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao bóng","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tableTennis","id":"tt_serve_long_fast","name":"Serve long and fast","nameZh":"发球 长且快","note":"Setup: 1 v 1, ball with S.\nBall path: S → R → S\nSequence: Step 1: S plays it to R; Step 2: R plays it to S, S moves right; Step 3: R moves left.\nCoaching point: Serve to set up the thir ":"d1","k":"player","l":"A","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tableTennis","id":"tt_game_serve_receive","name":"Match play serve and receive only","nameZh":"实战对抗 只练发接发","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A, 1 moves up the board; Step 2: A plays it to 1, A moves back.\nCoaching point: Play the point you have, not the one you rehearsed. Most rallies end by the fifth ball, so the plan has to survive the first two or it was never a plan.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A，1号球员向前移动；第2步：A 打向 1号球员，A回撤移动。\n【要点】打眼前这一分，不是打你练过的那一分。多数回合在第五板之前就结束了，所以战术必须能挺过前两板，否则它根本不算战术。","mistake":"Trying to win by hitting harder — half-table games expose exactly that player.","mistakeZh":"只想靠打得更重赢——半台对抗专治这种人。","category":"ssg","level":"development","minutes":15,"players":2,"family":{"en":"Match play","en-GB":"Match play","es-ES":"Juego de partido","fr-FR":"Jeu en match","id-ID":"Permainan pertandingan","ja-JP":"ゲーム練習","ko-KR":"실전 게임","ms-MY":"Permainan perlawanan","th-TH":"เล่นแบบแข่งขัน","vi-VN":"Đánh như thi đấu","zh-CN":"实战对抗","zh-TW":"實戰對抗"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"A","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tableTennis","id":"tt_game_full_match","name":"Match play a full game","nameZh":"实战对抗 整场比赛","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A, 1 moves up the board, A moves back; Step 2: A plays it to 1.\nCoaching point: Play the point you have, not the one you rehearsed. Most rallies end by the fifth ball, so the plan has to survive the first two or it was never a plan.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A，1号球员向前移动，A回撤移动；第2步：A 打向 1号球员。\n【要点】打眼前这一分，不是打你练过的那一分。多数回合在第五板之前就结束了，所以战术必须能挺过前两板，否则它根本不算战术。","mistake":"Trying to win by hitting harder — half-table games expose exactly that player.","mistakeZh":"只想靠打得更重赢——半台对抗专治这种人。","category":"ssg","level":"development","minutes":15,"players":2,"family":{"en":"Match play","en-GB":"Match play","es-ES":"Juego de partido","fr-FR":"Jeu en match","id-ID":"Permainan pertandingan","ja-JP":"ゲーム練習","ko-KR":"실전 게임","ms-MY":"Permainan perlawanan","th-TH":"เล่นแบบแข่งขัน","vi-VN":"Đánh như thi đấu","zh-CN":"实战对抗","zh-TW":"實戰對抗"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"A","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tableTennis","id":"tt_game_doubles","name":"Match play doubles rotation","nameZh":"实战对抗 双打轮转","note":"Setup: 2 v 2, ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A; Step 2: A plays it to 1, 1 moves back, 2 moves right, A moves up the board, B moves left.\nCoaching point: Every serve goes right half to right half, and you must alternate every ball — so the rotation is the drill: hit, and get out of your partner's way on the same movement.","noteZh":"【组织】2 对 2，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A；第2步：A 打向 1号球员，1号球员回撤移动，2号球员向右移动，A向前移动，B向左移动。\n【要点】发球必须右半台发到对方右半台，而且每球轮换——所以轮转本身就是训练内容：击完球的同一个动作里就让开搭档的位置。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"advanced","minutes":15,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"A","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tennis","id":"tn_warm_mini_tennis","name":"Warm-up mini tennis","nameZh":"热身 小场地网球","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1 moves right, 2 moves left; Step 2: 2 plays it to 1.\nCoaching point: Start inside the service boxes and work back. Rhythm first, power later — the first ten minutes decide how the next hour feels.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员向右移动，2号球员向左移动；第2步：2号球员 打向 1号球员。\n【要点】从发球区里面开始，再往后退。先找节奏，后加力量——前十分钟决定了接下来一小时的手感。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tennis","id":"tn_warm_service_box","name":"Warm-up service box rally","nameZh":"热身 发球区对拉","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1 moves right, 2 moves left; Step 2: 2 plays it to 1.\nCoaching point: Start inside the service boxes and work back. Rhythm first, power later — the first ten minutes decide how the next hour feels.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员向右移动，2号球员向左移动；第2步：2号球员 打向 1号球员。\n【要点】从发球区里面开始，再往后退。先找节奏，后加力量——前十分钟决定了接下来一小时的手感。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tennis","id":"tn_warm_baseline_feed","name":"Warm-up b ment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"foundation","minutes":8,"players":2,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tennis","id":"tn_serve_and_volley","name":"Serve and volley","nameZh":"发球上网","note":"Setup: 1 v 1, ball with S.\nSequence: Step 1: S moves up the board; Step 2: R moves back.\nCoaching point: Split step where you land, not where you meant to get to. A serve-volleyer still running when the return is struck is volleying from his shoelaces.","noteZh":"【组织】1 对 1，球在 S 脚下。\n【流程】第1步：S向前移动；第2步：R回撤移动。\n【要点】在你落地的位置做分腿垫步，而不是在你原本想到达的位置。接发球击出时人还在跑，那一拍截击就只能从鞋带上打。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"advanced","minutes":10,"players":2,"family":"","tags":[],"maxStep":4,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"tennis","id":"tn_attack_drop_shot","name":"Rally the drop shot and the pass","nameZh":"对拉 放小球与穿越","note":"Setup: 1 v 1.\nSequence: Step 1: 1 moves up the board, 2 moves back.\nCoaching point: Play it from inside the baseline off a short ball, and follow it in. A drop shot hit from behind the baseline gives the other player the two extra steps he needs.","noteZh":"【组织】1 对 1。\n【流程】第1步：1号球员向前移动，2号球员回撤移动。\n【要点】接短球时在底线内打出，然后跟上网。站在底线后面打的放小球，正好给了对手他需要的那两步。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"advanced","minutes":8,"players":2,"family":"","tags":[],"maxStep":4,"els":[{"id":"d0","k":"player"," k.","noteZh":"【组织】3 对 3，球在 P 脚下。\n【球路】P → S → A → D\n【流程】第1步：P 打向 S，P向前移动；第2步：S 打向 A，S向左移动，A回撤移动；第3步：A 打向 D，B向右移动，B向左移动，D回撤移动。\n【要点】助跑要晚而快，不要早而飘。真正让你高过拦网的，是最后两步。","mistake":"Starting the approach early and drifting — the last two steps make the jump, not the first.","mistakeZh":"助跑起太早还飘——起跳靠最后两步，不是第一步。","category":"finishing","level":"development","minutes":12,"players":6,"family":{"en":"Attack","en-GB":"Attack","es-ES":"Ataque desde","fr-FR":"Attaque","id-ID":"Serangan","ja-JP":"アタック","ko-KR":"공격","ms-MY":"Serangan","th-TH":"บุกจาก","vi-VN":"Tấn công","zh-CN":"进攻位置","zh-TW":"進攻位置"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"d2","k":"player","l":"A","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 3 步 B+B（相距 45）"}]},{"sport":"volleyball","id":"vb_attack_middle","name":"Attack from zone 3","nameZh":"进攻位置 3号位","note":"Setup: 3 v 3, ball with P.\nBall path: P → S → A → D\nSequence: Step 1: P plays it to S, P moves up the board; Step 2: S plays it to A, S moves left, A moves back; Step 3: A plays it to D, B moves right, B moves left, D moves back.\nCoaching point: Start the approach late and fast, not early and drifting. The last two steps are what gets you above the block.","noteZh":"【组织】3 对 3，球在 P 脚下。\n【球路】P → S → A → D\n【流程】第1步：P 打向 S，P向前移动；第2步：S 打向 A，S向左移动，A回撤移动；第3步：A 打向 D，B向右移动，B向左移动，D回撤移动。\n【要点】助跑要晚而快，不要早而飘。真正让你高过拦网的，是最后两步。","mistake":"Starting the approach early and drifting — the last two steps make the jump, not the first.","mistakeZh":"助跑起太早还飘——起跳靠最后两步，不是第一步。","category":"finishing","level":"development","minutes":12,"players":6,"family":{"en":"Attack","en-GB":"Attack","es-ES":"Ataque desde","fr-FR":"Attaque","id-ID":"Serangan","ja-JP":"アタック","  打向 D，B、D、D向前移动。\n【要点】要么封直线，要么封斜线，剩下的交给后排。两边都想够，等于把自己两手之间的缝送给了对方。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":10,"players":5,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"D","m":"none"},{"id":"d3","k":"player","l":"S","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"volleyball","id":"vb_block_double_outside","name":"Block double outside","nameZh":"拦网 外侧双人","note":"Setup: 4 v 2.\nBall path: A → D\nSequence: Step 1: the ball is played to A, A moves up the board; Step 2: A plays it to D, B, B, D, D moves up the board.\nCoaching point: Close the gap between hands before you close the gap to the hitter. A double block with daylight in it is two players wasted.","noteZh":"【组织】4 对 2。\n【球路】A → D\n【流程】第1步：球被传给A，A向前移动；第2步：A 打向 D，B、B、D、D向前移动。\n【要点】先并手，再靠人。中间漏光的双人拦网，等于白白站了两个人。","mistake":"A double block with daylight in it — two players wasted on one gap.","mistakeZh":"中间漏光的双人拦网——两个人白站。","category":"defending","level":"development","minutes":10,"players":6,"family":{"en":"Block","en-GB":"Block","es-ES":"Bloqueo","fr-FR":"Contre","id-ID":"Blok","ja-JP":"ブロック","ko-KR":"블로킹","ms-MY":"Sekatan","th-TH":"การบล็อก","vi-VN":"Chắn bóng","zh-CN":"拦网","zh-TW":"攔網"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"B","m":"none"},{"id":"d2","k":"player","l":"D","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"d4","k":"player","l":"S","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 B+B（相距 54）"}]},{"sport":"volleyball","id":"vb_block_double_middle","name":"Block double middle","nameZh":"拦网 中间双人","note":"Setup: 4 v 2.\nBall path: A that matters.","noteZh":"【组织】6 对 6，球在 1 脚下。\n【球路】1 → A → 2\n【流程】第1步：1号球员 打向 A，A 打向 2号球员，全队向前压上，A、D向左移动，B、E回撤移动，C、F向右移动。\n【要点】一定要计分。不计分的限制性比赛只是来回球，而来回球教不会任何人赢下关键分。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"advanced","minutes":20,"players":12,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"6","m":"none"},{"id":"d6","k":"player","l":"A","m":"none"},{"id":"d7","k":"player","l":"B","m":"none"},{"id":"d8","k":"player","l":"C","m":"none"},{"id":"d9","k":"player","l":"D","m":"none"},{"id":"d10","k":"player","l":"E","m":"none"},{"id":"d11","k":"player","l":"F","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"volleyball","id":"vb_cover_hitter","name":"Hitter coverage around the outside hitter","nameZh":"扣球掩护 主攻扣球时的掩护","note":"Setup: 5 v 2, ball with A.\nBall path: A → C\nSequence: Step 1: A carries the ball on the move; Step 2: A plays it to C, A runs up to take C's position, S moves left, C, C, C moves up the board.\nCoaching point: Three low and close around your own hitter before he lands. The ball off the block falls inside three metres, and nobody digs it standing up.","noteZh":"【组织】5 对 2，球在 A 脚下。\n【球路】A → C\n【流程】第1步：A带球推进；第2步：A 打向 C，A跑位到C的位置，S向左移动，C、C、C向前移动。\n【要点】在自己扣球手落地之前，三个人压低重心围到他身边。被拦回来的球落点都在三米以内，站着的人一个也救不起来。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":10,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"A","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"d2","k":"player","l":"C","m":"none"},{"id":"d3","k":"player","l":"C","m":"none"},{"id":"d4","k":"player","l":"C","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"volleyball","id":"vb_attack_quick","name":"First tempo the quick in front","nameZh":"快球 近体快","note":"Setup: 3 v 2, ball with P.\nBall path: P → S → M → the open spot\nSequence: Step 1: P plays it to S, P, M moves up the board; Step 2: S plays it to M, S moves left; Step 3: M plays the ball on, B moves right.\nCoaching point: The middle jumps before the set, not after it. If the setter has to wait for him the block has already read the whole play.","noteZh":"【组织】3 对 2，球在 P 脚下。\n【球路】P → S → M → 空位\n【流程】第1步：P 打向 S，P、M向前移动；第2步：S 打向 M，S向左移动；第3步：M把球传到下一个点，B向右移动。\n【要点】副攻在传球之前起跳，不是之后。二传要等他，说明对方拦网已经把整套球都读完了。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"development","minutes":12,"players":5,"family":{"en":"First tempo","en-GB":"First tempo","es-ES":"Primer tiempo","fr-FR":"Premier temps","id-ID":"Bola cepat","ja-JP":"速攻","ko-KR":"속공","ms-MY":"Bola pantas","th-TH":"บอลเร็ว","vi-VN":"Bóng nhanh","zh-CN":"快球","zh-TW":"快球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"d2","k":"player","l":"M","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 S+M（相距 26）；第 3 步 S+M（相距 26）"}]},{"sport":"volleyball","id":"vb_attack_slide","name":"First tempo the slide behind the setter","nameZh":"快球 背飞","note":"Setup: 3 v 2, ball with P.\nBall path: P → S → M → the open spot\nSequence: Step 1: P plays it to S, P moves up the board, M moves right; Step 2: S plays it to M, S moves left; Step 3: M plays the ball on, B moves left.\nCoaching point: The middle jumps before the set, not after it. If the setter has to wait for him the block has already read the whole play.","noteZh":"【组织】3 对 2，球在 P 脚下。\n【球路】P → S → M → 空位\n【流程】第1步：P 打向 S，P向前移动，M向右移动；第2步：S 打向 M，S向左移动；第3步：M把球传到下一个点，B向左移动。\n【要点】副攻在传球之前起跳，不是之后。二传要等他，说明对方拦网已经把整套球都读完了。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"advanced","minutes":12,"players":5,"family":{"en":"First tempo","en-GB":"First tempo","es-ES":"Primer tiempo","fr-FR":"Premier temps","id-ID":"Bola cepat","ja-JP":"速攻","ko-KR":"속공","ms-MY":"Bola pantas","th-TH":"บอลเร็ว","vi-VN":"Bóng nhanh","zh-CN":"快球","zh-TW":"快球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"d2","k":"player","l":"M","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"volleyball","id":"vb_receive_two_passer","name":"Libero in a two-passer receive","nameZh":"自由人 两人接发阵型","note":"Setup: 6 v 1, ball with H.\nBall path: H → L → S\nSequence: Step 1: H plays it to L, SV moves back; Step 2: L plays it to S, L, P moves up the board, S moves left.\nCoaching point: Two passers means the libero owns everything to his left and calls the seam early. Silence in a two-passer system is a service ace waiting to happen.","noteZh":"【组织】6 对 1，球在 H 脚下。\n【球路】H → L → S\n【流程】第1步：H 打向 L，SV回撤移动；第2步：L 打向 S，L、P向前移动，S向左移动。\n【要点】两人接发意味着自由人负责他左边的全部区域，并且要早喊结合部。两人接发里的沉默，就是一个还没发生的发球得分。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"advanced","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"L","m":"none"},{"id":"d1","k":"player","l":"P","m":"none"},{"id":"d2","k":"player","l":"S","m":"none"},{"id":"d3","k":"player","l":"H","m":"none"},{"id":"d4","k":"player","l":"M","m":"none"},{"id":"d5","k":"player","l":"H","m":"none"},{"id":"d6","k":"player","l":"SV","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"volleyball","id":"vb_setter_dump","name":"Setter release from the second-ball dump","nameZh":"二传插上 二次球偷吊","note":"Setup: 3 v 3, ball with P.\nBall path: P → S → the open spot\nSequence: Step 1: P plays it to S, P moves up the board; Step 2: S moves left; Step 3: S plays the ball on, H moves up the board, B, B moves left.\nCoaching point: Dump on the second ball only when the block is already moving with your hands. A dump telegraphed by a look is the easiest point the other side will get.","noteZh":"【组织】3 对 3，球在 P 脚下。\n【球路】P → S → 空位\n【流程】第1步：P 打向 S，P向前移动；第2步：S向左移动；第3步：S把球传到下一个点，H向前移动，B、B向左移动。\n【要点】只有在对方拦网已经跟着你的手动了的时候才二次球偷吊。用眼神暴露出来的偷吊，是对方拿分最轻松的一次。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"foundation","minutes":8,"players":6,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"d2","k":"player","l":"H","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"waterPolo","id":"wp_warm_eggbeater","name":"Warm-up eggbeater and pass","nameZh":"热身 踩水传球","note":"Setup: 4 players, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 throws to 2; Step 2: 2 throws to 1, 2 moves left, 4 moves right.\nCoaching point: Legs first. Everything in this sport is paid for by the eggbeater, and a player who sinks to catch has already lost the position.","noteZh":"【组织】4 人，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 传给 2号球员；第2步：2号球员 传给 1号球员，2号球员向左移动，4号球员向右移动。\n【要点】先练腿。这项运动的一切都是踩水换来的，接球时往下沉的人，位置已经丢了。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":4,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"waterPolo","id":"wp_warm_swim_catch","name":"Warm-up swim and catch","nameZh":"热身 游动接球","note":"Setup: 2 players, ball with 1.\nBall path: 1 → 2\nSequence: Step 1: 1, 2 moves up the board; Step 2: 1 throws to 2.\nCoaching point: Legs first. Everything in this sport is paid for by the eggbeater, and a player who sinks to catch has already lost the position.","noteZh":"【组织】2 人，球在 1 脚下。\n【球路】1 → 2\n【流程】第1步：1号球员、2号球员向前移动；第2步：1号球员 传给 2号球员。\n【要点】先练腿。这项运动的一切都是踩水换来的，接球时往下沉的人，位置已经丢了。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"waterPolo","id":"wp_warm_wet_pass","name":"Warm-up const KEY = 'drill-review-edits-v1';
let edits = {};
try { edits = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { edits = {}; }

const TAGS = [
  '传球','接球','控球','转身','运球','一对一','射门','头球',
  '定位球','压迫','退防','盯人','区域防守','攻防转换',
  '门将','小场比赛','体能','热身','技术','战术',
  '需要球门','需要锥桶','需要栏架','需要敏捷梯'
];

const key = d => d.sport + '/' + d.id;
const save = () => localStorage.setItem(KEY, JSON.stringify(edits));
const editOf = d => edits[key(d)] || {};
const isEdited = d => {
  const e = editOf(d);
  return !!(e.note && e.note.trim()) || !!(e.noteZh && e.noteZh.trim())
      || (e.tags && e.tags.length) || !!(e.fix && e.fix.trim());
};

// ── controls ───────────────────────────────────────────────────────────────
const sports = [...new Set(DRILLS.map(d => d.sport))];
const $sport = document.getElementById('sport');
$sport.innerHTML = '<option value="all">全部运动</option>' +
  sports.map(s => `<option value="${s}">${s} (${DRILLS.filter(d=>d.sport===s).length})</option>`).join('');

let current = null;
const $list = document.getElementById('list');
const $pane = document.getElementById('pane');

function visible() {
  const sp = $sport.value, f = document.getElementById('filter').value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  return DRILLS.filter(d => {
    if (sp !== 'all' && d.sport !== sp) return false;
    if (q && !(d.name.toLowerCase().includes(q) || d.nameZh.includes(q) || d.id.includes(q))) return false;
    if (f === 'error') return d.issues.some(i => i.level === 'error');
    if (f === 'edited') return isEdited(d);
    if (f === 'todo') return !isEdited(d);
    if (f !== 'all') return d.issues.some(i => i.id === f);
    return true;
  });
}

function renderList() {
  const vis = visible();
  const errs = vis.filter(d => d.issues.some(i => i.level === 'error')).length;
  const done = vis.filter(isEdited).length;
  document.getElementById('counts').innerHTML =
    `${vis.length} 个 · <b>${errs}</b> 个有错 · ${done} 个已改`;
  $list.innerHTML = vis.map(d => {
    const lv = new Set(d.issues.map(i => i.level));
    const dots = ['error','warn','info'].filter(l => lv.has(l))
      .map(l => `<span class="dot ${l}"></span>`).join('') +
      (isEdited(d) ? '<span class="dot done"></span>' : '');
    return `<button class="row ${current && key(current)===key(d) ? 'on':''}" data-k="${key(d)}">
      <span class="dots">${dots}</span>
      <span class="nm">${d.nameZh || d.name}</span>
      <span class="sub">${d.sport} · ${d.id}</span>
    </button>`;
  }).join('') || '<p class="empty">没有匹配的训练</p>';
  $list.querySelectorAll('.row').forEach(b =>
    b.addEventListener('click', () => select(DRILLS.find(d => key(d) === b.dataset.k))));
}

// ── board ──────────────────────────────────────────────────────────────────
// The boards are PNGs rendered by the app's own TacticsCanvas, so this page
// cannot disagree with the phone about what a drill looks like.
const src = (d, step) => `board_png/${d.sport}/${d.id}-${step}.png`;

function preload(d) {
  for (let i = 0; i <= d.maxStep; i++) new Image().src = src(d, i);
}

// ── detail ─────────────────────────────────────────────────────────────────
let step = 0;

function select(d) {
  current = d; step = 0; preload(d);
  renderList();
  renderPane();
}

function renderPane() {
  const d = current;
  if (!d) { $pane.innerHTML = '<p class="empty">从左边选一个训练</p>'; return; }
  const e = editOf(d);
  const issues = d.issues.length
    ? `<ul class="issues">${d.issues.map(i =>
        `<li class="issue ${i.level}"><span class="tag">${i.id}</span>${i.text}</li>`).join('')}</ul>`
    : '<p class="clean">没有查出问题</p>';

  $pane.innerHTML = `
    <div class="head">
      <div>
        <h1>${d.nameZh || d.name}</h1>
        <p class="zh">${d.name}</p>
      </div>
    </div>
    <p class="meta">
      <span>${d.sport}</span><span>${d.category}</span><span>${d.level}</span>
      <span>${d.minutes} 分钟</span><span>${d.players} 人</span>
      <span>${d.maxStep} 步</span>${d.family ? `<span>${d.family}</span>` : ''}
      <span>${d.id}</span>
    </p>

    <div class="split">
      <div class="boardwrap">
        <img class="board" id="svg" src="${src(d, step)}" alt="第 ${step} 步">
        <div class="steps">
          <button class="ghost" id="prev">‹</button>
          <span class="n" id="stepn">${step} / ${d.maxStep}</span>
          <button class="ghost" id="next">›</button>
          <button class="ghost" id="play">播放</button>
        </div>
      </div>

      <div>
        ${issues}

        <h3>现有说明</h3>
        <p class="cur">${d.note || '<i>空</i>'}</p>
        <p class="cur zh">${d.noteZh || '<i>空</i>'}</p>

        <h3>改写后的说明 · 中文</h3>
        <textarea id="noteZh" placeholder="怎么摆、怎么跑、教练看什么。写到 45 词以上才算详细。">${e.noteZh || ''}</textarea>
        <p class="wc" id="wcZh"></p>

        <h3>改写后的说明 · English</h3>
        <textarea id="note" placeholder="Setup, how it runs, what the coach is looking for.">${e.note || ''}</textarea>
        <p class="wc" id="wc"></p>

        <h3>标签</h3>
        <div class="tags" id="tags"></div>

        <h3>板子要怎么改</h3>
        <textarea id="fix" placeholder="例如：球要跟着 2→3→4→5 走完四步；3 号起始位置往右挪 60。">${e.fix || ''}</textarea>

        <h3>现有常见错误</h3>
        <p class="cur">${d.mistake || '<i>空</i>'}</p>
        <p class="cur zh">${d.mistakeZh || '<i>空</i>'}</p>

        <div class="actions">
          <button id="save">保存这一条</button>
          <button class="ghost" id="nextTodo">保存并跳到下一个</button>
          <span class="saved" id="savedmsg"></span>
        </div>
      </div>
    </div>`;

  const tagBox = document.getElementById('tags');
  const chosen = new Set(e.tags || d.tags || []);
  tagBox.innerHTML = TAGS.map(t =>
    `<button class="tag-btn ${chosen.has(t)?'on':''}" data-t="${t}">${t}</button>`).join('');
  tagBox.querySelectorAll('.tag-btn').forEach(b => b.addEventListener('click', () => {
    b.classList.toggle('on');
  }));

  const count = (ta, out, target) => {
    const n = ta.value.trim() ? ta.value.trim().split(/\s+|(?<=[一-龥])/).filter(Boolean).length : 0;
    out.textContent = `${n} 词 / 目标 ${target}+`;
    out.className = 'wc' + (n >= target ? ' ok' : '');
  };
  const zh = document.getElementById('noteZh'), en = document.getElementById('note');
  const wcZh = document.getElementById('wcZh'), wc = document.getElementById('wc');
  count(zh, wcZh, 45); count(en, wc, 45);
  zh.addEventListener('input', () => count(zh, wcZh, 45));
  en.addEventListener('input', () => count(en, wc, 45));

  document.getElementById('prev').onclick = () => { step = Math.max(0, step-1); redrawBoard(); };
  document.getElementById('next').onclick = () => { step = Math.min(d.maxStep, step+1); redrawBoard(); };
  document.getElementById('play').onclick = () => {
    step = 0; redrawBoard();
    const t = setInterval(() => {
      if (step >= d.maxStep) return clearInterval(t);
      step++; redrawBoard();
    }, 700);
  };
  document.getElementById('save').onclick = () => doSave(false);
  document.getElementById('nextTodo').onclick = () => doSave(true);
}

function redrawBoard() {
  const img = document.getElementById('svg');
  img.src = src(current, step);
  img.alt = `第 ${step} 步`;
  document.getElementById('stepn').textContent = `${step} / ${current.maxStep}`;
}

function doSave(advance) {
  const d = current;
  const tags = [...document.querySelectorAll('#tags .tag-btn.on')].map(b => b.dataset.t);
  edits[key(d)] = {
    sport: d.sport, id: d.id,
    noteZh: document.getElementById('noteZh').value.trim(),
    note: document.getElementById('note').value.trim(),
    fix: document.getElementById('fix').value.trim(),
    tags,
  };
  if (!isEdited(d)) delete edits[key(d)];
  save();
  document.getElementById('savedmsg').textContent = '已保存';
  setTimeout(() => { const m = document.getElementById('savedmsg'); if (m) m.textContent = ''; }, 1400);
  renderList();
  if (advance) {
    const vis = visible();
    const i = vis.findIndex(x => key(x) === key(d));
    if (i >= 0 && i + 1 < vis.length) select(vis[i+1]);
  }
}

document.getElementById('export').onclick = () => {
  const rows = Object.values(edits);
  if (!rows.length) return alert('还没有任何修改');
  const blob = new Blob([JSON.stringify(rows, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'drill_corrections.json';
  a.click();
};
document.getElementById('clear').onclick = () => {
  if (!confirm('清空所有本地修改？')) return;
  edits = {}; save(); renderList(); renderPane();
};
['sport','filter','q'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => { renderList(); }));

renderList();
// Open on the worked example rather than an empty pane: passing_diamond is
// the drill every fix so far was proven on, so review starts where the
// reference is. Falls back to the first visible drill for a filtered build.
select(DRILLS.find(d => d.id === 'passing_diamond') || visible()[0] || null);
</script>
</body>
</html>
