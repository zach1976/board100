<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练素材矫正</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg0:#071A1D; --bg1:#0B2328; --surface:#12333B; --surfaceHi:#173E47;
    --border:rgba(180,205,210,.18); --text:#F3F7F6; --dim:#9AAEB1; --off:#60777B;
    --accent:#18C7BC; --warning:#E6A93D; --danger:#EF5B62;
    --home:#3E8EF7; --away:#FF5964; --turf:#1E783C; --turfHi:#176B35;
    --display:'Archivo','Helvetica Neue',Arial,sans-serif;
    --body:'Source Sans 3','PingFang SC','Helvetica Neue',Arial,sans-serif;
    --mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg0);color:var(--text);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column}

  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;
             border-bottom:1px solid var(--border);background:var(--bg1);flex:none}
  .brand{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
  .counts{font-family:var(--mono);font-size:12px;color:var(--off);white-space:nowrap}
  .counts b{color:var(--danger);font-weight:500}
  .grow{flex:1}
  select,input[type=search]{font-family:var(--body);font-size:14px;color:var(--text);
       background:var(--surface);border:1px solid var(--border);border-radius:9px;
       padding:7px 11px}
  button{font-family:var(--body);font-size:14px;font-weight:600;color:#04191B;
         background:var(--accent);border:0;border-radius:9px;padding:8px 15px;cursor:pointer}
  button.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  button:hover{filter:brightness(1.08)}
  button:focus-visible{outline:2px solid var(--text);outline-offset:2px}

  main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  aside{border-right:1px solid var(--border);overflow-y:auto;background:var(--bg1)}
  .row{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;
       padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;
       font-weight:400;font-size:14px;border-radius:0}
  .row:hover{background:var(--surface);filter:none}
  .row.on{background:var(--surfaceHi)}
  .row .nm{display:block;color:var(--text)}
  .row .sub{display:block;font-family:var(--mono);font-size:11px;color:var(--off);margin-top:2px}
  .dots{float:right;display:flex;gap:3px;margin-top:4px}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.error{background:var(--danger)} .dot.warn{background:var(--warning)}
  .dot.info{background:var(--off)} .dot.done{background:var(--accent)}

  section.pane{overflow-y:auto;padding:24px 28px 64px}
  .head{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
  h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
  .zh{color:var(--dim);font-size:16px;margin:2px 0 0}
  .meta{font-family:var(--mono);font-size:12px;color:var(--off);margin:10px 0 0}
  .meta span{display:inline-block;padding:3px 8px;border:1px solid var(--border);
             border-radius:999px;margin:0 6px 6px 0}

  .split{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:28px;margin-top:20px;
         align-items:start}
  @media (max-width:1100px){.split{grid-template-columns:1fr}main{grid-template-columns:240px 1fr}}

  .boardwrap{position:sticky;top:0}
  img.board{width:100%;height:auto;border-radius:12px;border:1px solid var(--border);
            display:block;background:var(--turfHi)}
  .steps{display:flex;align-items:center;gap:8px;margin-top:10px}
  .steps .n{font-family:var(--mono);font-size:13px;color:var(--dim);min-width:52px;text-align:center}
  .steps button{padding:6px 12px}

  .issues{margin:0 0 22px;padding:0;list-style:none}
  .issue{border:1px solid var(--border);border-left:3px solid var(--off);
         border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 8px;background:var(--bg1);
         font-size:14px}
  .issue.error{border-left-color:var(--danger)}
  .issue.warn{border-left-color:var(--warning)}
  .issue .tag{font-family:var(--mono);font-size:11px;color:var(--off);
              text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
  .clean{color:var(--accent);font-size:14px;margin:0 0 22px}

  h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;
     text-transform:uppercase;color:var(--off);margin:22px 0 8px}
  .cur{background:var(--bg1);border:1px solid var(--border);border-radius:10px;
       padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 6px;
       white-space:pre-line}
  .cur.zh{font-size:14px}
  textarea{width:100%;font-family:var(--body);font-size:14.5px;line-height:1.6;color:var(--text);
           background:var(--surface);border:1px solid var(--border);border-radius:10px;
           padding:12px 14px;resize:vertical;min-height:96px}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .wc{font-family:var(--mono);font-size:11.5px;color:var(--off);margin-top:5px}
  .wc.ok{color:var(--accent)}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .tag-btn{font-family:var(--body);font-size:13px;font-weight:400;padding:5px 11px;
           border-radius:999px;border:1px solid var(--border);background:transparent;
           color:var(--dim);cursor:pointer}
  .tag-btn.on{background:rgba(24,199,188,.14);border-color:rgba(24,199,188,.5);color:var(--accent)}
  .tag-btn:hover{filter:none;border-color:var(--dim)}

  .actions{display:flex;gap:10px;align-items:center;margin-top:26px;
           padding-top:18px;border-top:1px solid var(--border)}
  .saved{font-size:13px;color:var(--accent)}
  .empty{color:var(--off);padding:60px 0;text-align:center}
</style>
</head>
<body>

<header class="top">
  <span class="brand">训练素材矫正</span>
  <select id="sport"></select>
  <select id="filter">
    <option value="all">全部</option>
    <option value="error">只看有错的</option>
    <option value="ball_static">球不动</option>
    <option value="overlap">有重叠</option>
    <option value="short_note">说明太短</option>
    <option value="edited">我改过的</option>
    <option value="todo">还没改的</option>
  </select>
  <input type="search" id="q" placeholder="搜索名称…" style="width:180px">
  <span class="counts" id="counts"></span>
  <span class="grow"></span>
  <button class="ghost" id="clear">清空我的修改</button>
  <button id="export">导出修改</button>
</header>

<main>
  <aside id="list"></aside>
  <section class="pane" id="pane"></section>
</main>

d take it early enough that the reply goes downward. A shuttle met below the tape has already lost you the rally.","noteZh":"【组织】1 对 1，2 个锥标。\n【流程】第1步：R向前移动；第2步：S回撤移动。\n【要点】发球出手前拍头就举到网带高度，重心前压，早点碰到球，让回球往下走。在网带以下才碰到的球，这一分已经输了一半。","mistake":"Improvising a moment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"development","minutes":8,"players":2,"family":{"en":"Return of serve","en-GB":"Return of serve","es-ES":"Resto del saque contra el saque","fr-FR":"Retour de service contre le service","id-ID":"Pengembalian servis melawan servis","ja-JP":"レシーブ","ko-KR":"서브 리턴","ms-MY":"Kembalian servis menentang servis","th-TH":"การรับเสิร์ฟ","vi-VN":"Đỡ giao cầu đỡ giao cầu","zh-CN":"接发球","zh-TW":"接發球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"R","m":"none"},{"id":"d1","k":"player","l":"S","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"badminton","id":"bd_clear_round_the_head","name":"Clear round the head","nameZh":"高远球 头顶球","note":"Setup: 1 v 1, 1 cones.\nSequence: Step 1: 1 moves back; Step 2: F moves left.\nCoaching point: Take it round the head rather than turning your back: the moment you turn, the straight reply is gone and the opponent only has to cover one side.","noteZh":"【组织】1 对 1，1 个锥标。\n【流程】第1步：1号球员回撤移动；第2步：F向左移动。\n【要点】用头顶球处理，不要转身背对：一转身，直线回球就没有了，对手只需要守一边。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"development","minutes":8,"players":2,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"badminton","id":"bd_net_battle","name":"Net the battle 体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":12,"players":2,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"baseball","id":"bb_hit_two_strike","name":"Hitting the two-strike approach","nameZh":"打击 两好球后的应对","note":"Setup: a full infield behind a live pitcher; the hitter works from the plate with two strikes on him.\nSequence: Step 2: B moves right.\nCoaching point: Same load, same stride, whatever the pitch is. A swing that changes its start because the ball changed is already late.","noteZh":"【组织】内场守全员，投手投球；打者两好球后从本垒继续应对。\n【流程】第2步：B向右移动。\n【要点】无论来球是什么，引拍和跨步都一样。因为球变了才改变起手动作的挥棒，已经晚了。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":12,"players":8,"family":{"en":"Hitting","en-GB":"Hitting","es-ES":"Bateo","fr-FR":"Frappe","id-ID":"Memukul","ja-JP":"打撃","ko-KR":"타격","ms-MY":"Memukul","th-TH":"การตี","vi-VN":"Đánh bóng","zh-CN":"打击","zh-TW":"打擊"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"C","m":"none"},{"id":"d2","k":"player","l":"1B","m":"none"},{"id":"d3","k":"player","l":"2B","m":"none"},{"id":"d4","k":"player","l":"SS","m":"none"},{"id":"d5","k":"player","l":"3B","m":"none"},{"id":"d6","k":"player","l":"CF","m":"none"},{"id":"d7","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"m2","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"baseball","id":"bb_hit_bunt_technique","name":"Hitting laying down the bunt","nameZh":"打击 触击技术","note":"Setup: 6 v 1.\nSequence: Step 1: 1B, 3B moves back; Step 2: B moves left.\nCoaching po ounder into a long throw you have no time for.","noteZh":"【组织】游击、一垒手、击球手三人；球打向游击手左侧和反手位。\n【流程】第1步：SS向左移动。\n【要点】要穿过球去接，不是跑到球那儿停住。原地站定接的滚地球，会把一个常规出局变成一次你来不及的长传。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":12,"players":3,"family":{"en":"Fielding fundamentals","en-GB":"Fielding fundamentals","es-ES":"Fundamentos de defensa","fr-FR":"Bases de la défense","id-ID":"Dasar bertahan","ja-JP":"守備の基本","ko-KR":"수비 기본기","ms-MY":"Asas pertahanan","th-TH":"พื้นฐานการรับลูก","vi-VN":"Kỹ thuật bắt bóng cơ bản","zh-CN":"守备基本功","zh-TW":"守備基本功"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"SS","m":"none"},{"id":"d1","k":"player","l":"1B","m":"none"},{"id":"d2","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"baseball","id":"bb_field_fly_ball","name":"Fielding fundamentals the drop step and the fly ball","nameZh":"守备基本功 后撤步与高飞球","note":"Setup: 3 players.\nSequence: Step 1: CF moves up the board; Step 2: 2B moves up the board.\nCoaching point: Move through the ball, not to it. Fielding flat-footed turns a routine grounder into a long throw you have no time for.","noteZh":"【组织】3 人。\n【流程】第1步：CF向前移动；第2步：2B向前移动。\n【要点】要穿过球去接，不是跑到球那儿停住。原地站定接的滚地球，会把一个常规出局变成一次你来不及的长传。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":12,"players":3,"family":{"en":"Fielding fundamentals","en-GB":"Fielding fundamentals","es-ES":"Fundamentos de defensa","fr-FR":"Bases de la défense","id-ID":"Dasar bertahan","ja-JP":"守備の基本","ko-KR":"수비 기본기","ms-MY":"Asas pertahanan","th-TH":"พื้นฐานการรับลูก","vi-VN":"Kỹ thuật bắt bóng cơ bản","zh-CN":"守备基本功","zh-TW":"守備基本功"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"CF","m":"none"},{"id":"d1","k":"player","l":"2B","m":"none"},{"id":"d2","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"baseball","id":"bb_pitch_bullpen","name":"Fielding fundamentals the bullpen and the sequence","nameZh":"守备基本功 牛棚投球与配球","note":"Setup: 2 players.\nSequence: Step 1: P moves back; Step 2: C moves right.\nCoaching point: Move through the ball, not to it. Fielding flat-footed turns a routine grounder into a long throw you have no time for.","noteZh":"【组织】2 人。\n【流程】第1步：P回撤移动；第2步：C向右移动。\n【要点】要穿过球去接，不是跑到球那儿停住。原地站定接的滚地球，会把一个常规出局变成一次你来不及的长传。","mistake":"Improvising a moment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"foundation","minutes":12,"players":2,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"P","m":"none"},{"id":"d1","k":"player","l":"C","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"m2","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"basketball","id":"bb_layup_lines","name":"Layup lines","nameZh":"上篮轮转","note":"Setup: 4 players, ball with 1.\nBall path: 1 → 2 → goal\nSequence: Step 1: 1 throws to 2, 1, 2 moves up the board; Step 2: 2 shoots.\nCoaching point: Inside foot, outside hand, eyes on the square — not on the ball.","noteZh":"【组织】4 人，球在 1 脚下。\n【球路】1 → 2 → 球门\n【流程】第1步：1号球员 传给 2号球员，1号球员、2号球员向前移动；第2步：2号球员起脚射门。\n【要点】内侧脚起跳、外侧手上篮，眼睛盯篮板方框，不是盯球。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"basketball","id":"bb_two_ball_dribble","name":"Two-ball dribbling","nameZh":"双球运球","note":"Setup: 1 players, 4 cones, ball with 1.\nSequence: Step 1: 1 carries the ball on the move, 1 moves up the board.\nCoaching point: Head up the whole way. If you can't call out the coach's fingers, you're watching the ball.","noteZh":"【组织】1 人，4 个锥标，球在 1 脚下。\n【流程】第1步：1号球员带球推进，1号球员向前移动。\n【要点】全程抬头。喊不出教练比的数字，就说明你在看球。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":6,"players":1,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"basketball","id":"bb_star_passing","name":"Star passing","nameZh":"五角星传球","note":"Setup: 5 players, ball with 1.\nBall path: 1 → 2 → 3 → 4 → 5 → 1\nSequence: Step 1: 1 throws to 2; Step 2: 2 throws to 3, 1 runs up to take 2's position; Step 3: 3 throws to 4, 2 runs up to take 3's position; Step 4: 4 throws to 5, 3 runs up to take 4's position; Step 5: 5 throws to 1, 4 runs up to take 5's position; Step 6: 5 moves right.\nCoaching point: Pass and go — behind the player you passed to. A pass without movement is a stop.","noteZh":"【组织】5 人，球在 1 脚下。\n【球路】1 → 2 → 3 → 4 → 5 → 1\n【流程】第1步：1号球员 传给 2号球员；第2步：2号球员 传给 3号球员，1号球员跑位到2号球员的位置；第3步：3号球员 传给 4号球员，2号球员跑位到3号球员的位置；第4步：4号球员 传给 5号球员，3号球员跑位到4号球员的位置；第5步：5号球员 传给 1号球员，4号球员跑位到5号球员的位置；第6步：5号球员向右移动。\n【要点】传完就跑，跑到你传球对象身后。不带跑动的传球等于停球。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":5,"family":"","tags":[],"maxStep":6,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 1+2（相距 45）；第 4 步 3+4（相距 51）"}]},{"sport":"basketball","id":"bb_five_out_spacing","name":"Five-out spacing","nameZh":"五外站位","note":"Setup: 5 players, ball with 1.\nBall path: 1 → 2 → 4\nSequence: Step 1: 1 throws to 2, 1 moves left; Step 2: 2 throws to 4, 2 moves up the board, 4 moves back.\nCoaching point: Fifteen feet apart. One defender must never be able to guard two of you.","noteZh":"【组织】5 人，球在 1 脚下。\n【球路】1 → 2 → 4\n【流程】第1步：1号球员 传给 2号球员，1号球员向左移动；第2步：2号球员 传给 4号球员，2号球员向前移动，4号球员回撤移动。\n【要点】间距保持四五米。**一个防守人永远不能同时看住你们两个**。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"development","minutes":12,"players":5,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"basketball","id":"bb_pick_and_roll","name":"Pick and roll","nameZh":"挡拆下顺","note":"Setup: 5 v 2, ball with 1.\nBall path: 1 → 5\nSequence: Step 1: 5 moves back; Step 2: 1 carries the ball on the move, 1, x1 moves left, x5 moves back; Step 3: 1 throws to 5.\nCoaching point: Set the screen and hold it. The guard's job is to turn the corner tight enough that both defenders are behind him.","noteZh":"【组织】5 对 2，球在 1 脚下。\n【球路】1 → 5\n【流程】第1步：5号球员回撤移动；第2步：1号球员带球推进，1号球员、x1向左移动，x5回撤移动；第3步：1号球员 传给 5号球员。\n【要点】掩护要站稳别动。持球人要贴着掩护转过去，紧到两个防守人都被甩在身后。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":15,"players":7,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"5","m":"none"},{"id":"d2","k":"player","l":"2","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"4","m":"none"},{"id":"d5","k":"player","l":"x1","m":"none"},{"id":"d6","k":"player","l":"x5","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"5 处球员重叠：第 1 步 5+x1（相距 55）；第 2 步 1+x5（相距 51）；第 2 步 5+x1（相距 31）；第 2 步 5+x5（相距 56）；第 2 步 x1+x5（相距 40）"}]},{"sport":"basketball","id":"bb_pick_and_pop","name":"Pick and pop","nameZh":"挡拆外弹","note":"Setup: 5 v 2, ball with 1.\nBall path: 1 → 4\nSequence: Step 1: 4 moves back; Step 2: 1 carries the ball on the move, 1, x1 moves left, x4 moves back; Step 3: 1 throws to 4.\nCoaching point: Same screen, opposite read: if the big's defender steps up, he pops instead of rolling.","noteZh":"【组织】5 对 2，球在 1 脚下。\n【球路】1 → 4\n【流程】第1步：4号球员回撤移动；第2步：1号球员带球推进，1号球员、x1向左移动，x4回撤移动；第3步：1号球员 传给 4号球员。\n【要点】同样的掩护，反向判断：只要对方内线上提，掩护人就外弹而不是下顺。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":12,"players":7,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"4","m":"none"},{"id":"d2","k":"player","l":"2","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"x1","m":"none"},{"id":"d6","k":"player","l":"x4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"5 处球员重叠：第 1 步 4+x1（相距 55）；第 2 步 4+x1（相距 27）；第 2 步 4+x4（相距 54）；第 2 步 x1+x4（相距 27）；第 3 步 x1+x4（相距 27）"}]},{"sport":"basketball","id":"bb_backdoor_cut","name":"Backdoor cut","nameZh":"反跑空切","note":"Setup: 4 v 1, ball with 1.\nBall path: 1 → 2\nSequence: Step 1: 2 moves back, x2 moves right; Step 2: 1 throws to 2.\nCoaching point: The cut is the answer to an overplay: two steps out, then hard to the rim the moment he turns his head.","noteZh":"【组织】4 对 1，球在 1 脚下。\n【球路】1 → 2\n【流程】第1步：2号球员回撤移动，x2向右移动；第2步：1号球员 传给 2号球员。\n【要点】对手过度贴防就反跑：先向外两步，等他一转头立刻直插篮下。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":10,"players":5,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"5","m":"none"},{"id":"d4","k":"player","l":"x2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 2+x2（相距 29）"}]},{"sport":"basketball","id":"bb_dho","name":"Dribble handoff","nameZh":"运球交手","note":"Setup: 5 v 1, ball with 1.\nBall path: 1 → 2\nSequence: Step 1: 1 carries the ball on the move, 1 moves right; Step 2: 1 throws to 2, 2, x2 moves left; Step 3: 2 carries the ball on the move.\nCoaching point: Hand it off shoulder to shoulder — a gap the size of a defender is a gap he will use.","noteZh":"【组织】5 对 1，球在 1 脚下。\n【球路】1 → 2\n【流程】第1步：1号球员带球推进，1号球员向右移动；第2步：1号球员 传给 2号球员，2号球员、x2向左移动；第3步：2号球员带球推进。\n【要点】交手要肩碰肩，留出一个防守人宽的缝，他就会从缝里挤过来。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":12,"players":6,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"x2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 1+2（相距 58）"}]},{"sport":"basketball","id":"bb_horns_set","name":"Horns set","nameZh":"牛角战术","note":"Setup: 5 players, ball with 1.\nBall path: 1 → 5\nSequence: Step 1: 4, 5 moves back; Step 2: 1 carries the ball on the move, 1 moves up the board; Step 3: 1 throws to 5.\nCoaching point: Two bigs at the elbows, two in the corners. Whichever screen the defence takes away, the other one is open.","noteZh":"【组织】5 人，球在 1 脚下。\n【球路】1 → 5\n【流程】第1步：4号球员、5号球员回撤移动；第2步：1号球员带球推进，1号球员向前移动；第3步：1号球员 传给 5号球员。\n【要点】两个内线站罚球线两肘，两人站底角。防守封掉哪一侧掩护，另一侧就是空的。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"development","minutes":12,"players":5,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"4","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"2","m":"none"},{"id":"d4","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 1+5（相距 40）"}]},{"sport":"basketball","id":"bb_catch_and_shoot","name":"Catch and shoot","nameZh":"接球就投","note":"Setup: 3 players, ball with 5.\nBall path: 5 → 2 → 3 → goal\nSequence: Step 1: 5 throws to 2, 2 moves up the board; Step 2: 2 throws to 3, 3 moves up the board; Step 3: 3 shoots.\nCoaching point: Feet and hands ready before the pass arrives. The shot starts on the catch, not after it.","noteZh":"【组织】3 人，球在 5 脚下。\n【球路】5 → 2 → 3 → 球门\n【流程】第1步：5号球员 传给 2号球员，2号球员向前移动；第2步：2号球员 传给 3号球员，3号球员向前移动；第3步：3号球员起脚射门。\n【要点】球到之前脚步和手型就要准备好。出手动作从接球那一刻开始，不是接完再开始。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"foundation","minutes":10,"players":3,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"basketball","id":"bb_post_finish","name":"Post finishing","nameZh":"低位终结","note":"Setup: 2 v 2, ball with 1.\nBall path: 1 → 5 → goal\nSequence: Step 1: 1 throws to 5; Step 2: 5 shoots, 5 moves up the board, x5 moves right, x4 moves left.\nCoaching point: Seal, catch, one dribble, finish over the shoulder away from the help.","noteZh":"【组织】2 对 2，球在 1 脚下。\n【球路】1 → 5 → 球门\n【流程】第1步：1号球员 传给 5号球员；第2步：5号球员起脚射门，5号球员向前移动，x5向右移动，x4向左移动。\n【要点】先卡住位、接球、一次运球、朝远离协防的那侧翻身出手。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"development","minutes":10,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"1","m":"none"},{"id":"d2","k":"player","l":"x5","m":"none"},{"id":"d3","k":"player","l":"x4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 5+x5（相距 45）；第 2 步 5+x4（相距 59）"}]},{"sport":"basketball","id":"bb_closeout","name":"Closeouts","nameZh":"封盖扑防","note":"Setup: 2 v 2.\nBall path: 2 → 3\nSequence: Step 1: the ball is played to 2, x1 moves left; Step 2: 2 throws to 3, x2 moves back.\nCoaching point: Sprint two thirds, chop the last third with short steps and a high hand. Flying at a shooter is how you foul him.","noteZh":"【组织】2 对 2。\n【球路】2 → 3\n【流程】第1步：球被传给2号球员，x1向左移动；第2步：2号球员 传给 3号球员，x2回撤移动。\n【要点】前三分之二全速冲，最后三分之一碎步刹车、举手。冲太猛就是送犯规。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":10,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"x1","m":"none"},{"id":"d1","k":"player","l":"x2","m":"none"},{"id":"d2","k":"player","l":"2","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"3 处球员重叠：第 1 步 x1+2（相距 45）；第 2 步 x1+2（相距 45）；第 2 步 x2+3（相距 45）"}]},{"sport":"basketball","id":"bb_help_and_recover","name":"Help and recover","nameZh":"协防与回位","note":"Setup: 2 v 2.\nBall path: 1 → 4\nSequence: Step 1: the ball is played to 1, x4 moves right, x1, 1 moves up the board; Step 2: 1 throws to 4, 4 moves left.\nCoaching point: Help early, recover on the pass — not on the catch. Recovering late is worse than never helping.","noteZh":"【组织】2 对 2。\n【球路】1 → 4\n【流程】第1步：球被传给1号球员，x4向右移动，x1、1号球员向前移动；第2步：1号球员 传给 4号球员，4号球员向左移动。\n【要点】协防要早，回位要在**传球出手时**，不是等对方接到球。回位慢比不协防更糟。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"development","minutes":12,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"x4","m":"none"},{"id":"d1","k":"player","l":"x1","m":"none"},{"id":"d2","k":"player","l":"1","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 x4+1（相距 40）"}]},{"sport":"basketball","id":"bb_box_out","name":"Box out","nameZh":"卡位篮板","note":"Setup: 2 v 2.\nBall path: goal\nSequence: Step 1: ? shoots, x4, x5 moves back, 4, 5 moves up the board.\nCoaching point: Find your man before you find the ball. Contact first, then go get it — every rebound is won a second before it comes off.","noteZh":"【组织】2 对 2。\n【球路】球门\n【流程】第1步：?起脚射门，x4、x5回撤移动，4号球员、5号球员向前移动。\n【要点】先找人，再找球。先接触卡住，再去抢 —— 篮板是在球弹出来之前一秒决定的。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":8,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"x4","m":"none"},{"id":"d1","k":"player","l":"x5","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"5","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 x4+4（相距 27）；第 1 步 x5+5（相距 27）"}]},{"sport":"basketball","id":"bb_blob_box","name":"Baseline inbounds: box","nameZh":"底线发球：箱型战术","note":"Setup: 5 v 3, ball with 1.\nBall path: 1 → 4 → goal\nSequence: Step 1: 1 throws to 4, 2 moves left, 3 moves back, 4 moves up the board, 5 moves right; Step 2: 4 shoots.\nCoaching point: The first cutter is a decoy; the screener becomes the target. Count out loud — five seconds goes fast.","noteZh":"【组织】5 对 3，球在 1 脚下。\n【球路】1 → 4 → 球门\n【流程】第1步：1号球员 传给 4号球员，2号球员向左移动，3号球员回撤移动，4号球员向前移动，5号球员向右移动；第2步：4号球员起脚射门。\n【要点】第一个跑动的人是幌子，掩护的人才是目标。出声数秒 —— 五秒过得很快。","mistake":"Improvising a moment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"development","minutes":10,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"x2","m":"none"},{"id":"d6","k":"player","l":"x3","m":"none"},{"id":"d7","k":"player","l":"x4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 4+x2（相距 16）"}]},{"sport":"basketball","id":"bb_press_break","name":"Press break","nameZh":"破全场紧逼","note":"Setup: 5 v 3, ball with 5.\nBall path: 5 → 1 → 3 → 4\nSequence: Step 1: 5 throws to 1, 1, 2, x1, x2 moves up the board; Step 2: 1 throws to 3, 3, x3 moves up the board; Step 3: 3 throws to 4.\nCoaching point: Get it to the middle. A ball in the centre of the floor beats a press; a ball on the sideline feeds it.","noteZh":"【组织】5 对 3，球在 5 脚下。\n【球路】5 → 1 → 3 → 4\n【流程】第1步：5号球员 传给 1号球员，1号球员、2号球员、x1、x2向前移动；第2步：1号球员 传给 3号球员，3号球员、x3向前移动；第3步：3号球员 传给 4号球员。\n【要点】把球送到中路。球在场地中间就破了紧逼，球贴边线就是在喂给他们。","mistake":"Improvising a moment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"advanced","minutes":12,"players":8,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"1","m":"none"},{"id":"d2","k":"player","l":"2","m":"none"},{"id":"d3","k":"player","l":"3","m":"no eeds.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"development","minutes":10,"players":6,"family":{"en":"Off-ball screen","en-GB":"Off-ball screen","es-ES":"Bloqueo indirecto","fr-FR":"Écran sans ballon","id-ID":"Screen tanpa bola","ja-JP":"オフボールスクリーン","ko-KR":"오프볼 스크린","ms-MY":"Skrin tanpa bola","th-TH":"การสกรีนนอกบอล","vi-VN":"Màn chắn không bóng","zh-CN":"无球掩护","zh-TW":"無球掩護"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"X2","m":"none"},{"id":"d5","k":"player","l":"X1","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"3 处球员重叠：第 2 步 2+5（相距 20）；第 2 步 5+X2（相距 58）；第 3 步 2+X2（相距 46）"}]},{"sport":"basketball","id":"bb_free_throw","name":"Free throws","nameZh":"罚球","note":"Setup: 3 v 2, ball with 1.\nBall path: 1 → goal → 2\nSequence: Step 1: 1 shoots, 1 moves up the board; Step 2: the ball is played to 2, 2, 3, X2, X3 moves up the board.\nCoaching point: Same routine, same number of dribbles, same breath — every time, in practice as well. A free throw is the only shot nobody is guarding, so nothing about it should ever change.","noteZh":"【组织】3 对 2，球在 1 脚下。\n【球路】1 → 球门 → 2\n【流程】第1步：1号球员起脚射门，1号球员向前移动；第2步：球被传给2号球员，2号球员、3号球员、X2、X3向前移动。\n【要点】同一套动作、同样次数的运球、同一次呼吸——每一次都一样，训练时也一样。罚球是全场唯一没人防的球，所以它不该有任何变化。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"foundation","minutes":8,"players":5,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"X2","m":"none"},{"id":"d4","k":"player","l":"X3","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"" 身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"beachTennis","id":"bt_rally_straight","name":"Volley rally straight","nameZh":"截击对拉 直线","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1 moves up the board; Step 2: 2 plays it to 1, 2 moves back.\nCoaching point: There is no bounce to wait for, so the racket has to be up before the ball leaves their strings, not after.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员向前移动；第2步：2号球员 打向 1号球员，2号球员回撤移动。\n【要点】没有落地那一下可以等，所以球拍必须在对方击球之前就举好，而不是之后。","mistake":"Waiting for a bounce that never comes — the racket must be up before they hit.","mistakeZh":"在等一个不会来的落地——对方击球前拍子就要举好。","category":"possession","level":"foundation","minutes":10,"players":2,"family":{"en":"Volley rally","en-GB":"Volley rally","es-ES":"Peloteo de voleas","fr-FR":"Échange de volées","id-ID":"Reli voli","ja-JP":"ボレーラリー","ko-KR":"발리 랠리","ms-MY":"Rali voli","th-TH":"โต้วอลเลย์","vi-VN":"Đôi công vô lê","zh-CN":"截击对拉","zh-TW":"截擊對拉"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"beachTennis","id":"bt_rally_cross_court","name":"Volley rally cross-court","nameZh":"截击对拉 斜线","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1 moves up the board; Step 2: 2 plays it to 1, 2 moves back.\nCoaching point: There is no bounce to wait for, so the racket has to be up before the ball leaves their strings, not after.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员向前移动；第2步：2号球员 打向 1号球员，2号球员回撤移动。\n【要点】没有落地那一下可以等，所以球拍必须在对方击球之前就举好，而不是之后。","mistake":"Waiting for a bounce that never comes — the racket must be up before they hit.","mistakeZh":"在等一个不会来的落地——对方击球前拍子就要举好。","c raint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"development","minutes":15,"players":7,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"A","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"C","m":"none"},{"id":"d6","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_game_5v5","name":"Game 5v5","nameZh":"对抗 5v5","note":"Setup: 5 v 6, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 passes to 2, 2 passes to 3, 1, 2, 3, 4, 5 moves up the board, A, B, C, D, E moves back.\nCoaching point: Play to circle entries rather than goals when you want the build-up to improve; the finishing will follow the arrivals.","noteZh":"【组织】5 对 6，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员把球传给2号球员，2号球员把球传给3号球员，1号球员、2号球员、3号球员、4号球员、5号球员向前移动，A、B、C、D、E回撤移动。\n【要点】想练组织的时候，就用进圈次数计分，而不是进球。终结能力会跟着进圈次数一起长。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"development","minutes":15,"players":11,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"d8","k":"player","l":"D","m":"none"},{"id":"d9","k":"player","l":"E","m":"none"},{"id":"d10","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_game_7v7","name":"Game 7v7","nameZh":"对抗 7v7","note":"Setup: 7 v 8, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 passes to 2, 2 passes to 3, the whole team moves up the board, the whole team moves back.\nCoaching point: Play to circle entries rather than goals when you want the build-up to improve; the finishing will follow the arrivals.","noteZh":"【组织】7 对 8，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员把球传给2号球员，2号球员把球传给3号球员，全队向前压上，全队回撤压上。\n【要点】想练组织的时候，就用进圈次数计分，而不是进球。终结能力会跟着进圈次数一起长。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"advanced","minutes":15,"players":15,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"6","m":"none"},{"id":"d6","k":"player","l":"7","m":"none"},{"id":"d7","k":"player","l":"A","m":"none"},{"id":"d8","k":"player","l":"B","m":"none"},{"id":"d9","k":"player","l":"C","m":"none"},{"id":"d10","k":"player","l":"D","m":"none"},{"id":"d11","k":"player","l":"E","m":"none"},{"id":"d12","k":"player","l":"F","m":"none"},{"id":"d13","k":"player","l":"G","m":"none"},{"id":"d14","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_defend_tackle","name":"Tackling","nameZh":"抢断","note":"Setup: 1 v 1, 2 cones.\nBall path: A → D\nSequence: Step 1: the ball is played to A, D moves back, A moves up the board; Step 2: A passes to D.\nCoaching point: Match his speed first, then take the ball. A tackle made while you are still closing is a foul, and the umpire has seen it before you have.","noteZh":"【组织】1 对 1，2 个锥标。\n【球路】A → D\n【流程】第1步：球被传给A，D回撤移动，A向前移动；第2步：A把球传给D。\n【要点】先跟上他的速度，再去断球。还在冲过去的时候出杆，那是犯规，而且裁判比你先看见。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":10,"players":2,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"D","m":"none"},{"id":"d1","k":"player","l":"A","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_build_aerial","name":"Building up with the aerial","nameZh":"组织推进 用高球转移","note":"Setup: 3 v 2, ball with 2.\nBall path: 2 → 7\nSequence: Step 1: 2 moves up the board, D moves back; Step 2: 2 passes to 7, 7, 8, D moves up the board.\nCoaching point: Land it in space with nobody under it, and shout early. Five metres is the rule and the receiver cannot claim it if he arrived at the same time as the ball.","noteZh":"【组织】3 对 2，球在 2 脚下。\n【球路】2 → 7\n【流程】第1步：2号球员向前移动，D回撤移动；第2步：2号球员把球传给7号球员，7号球员、8号球员、D向前移动。\n【要点】把球落到没人的空当里，并且早喊。五米是规则，接球人和球同时到，就没有优先权。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"development","minutes":10,"players":5,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"2","m":"none"},{"id":"d1","k":"player","l":"7","m":"none"},{"id":"d2","k":"player","l":"8","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 2+D（相距 56）；第 2 步 2+D（相距 56）"}]},{"sport":"fieldHockey","id":"fh_set_long_corner","name":"Long corner","nameZh":"长角球","note":"Setup: 3 v 3, ball with 7.\nBall path: 7 → 9 → 10\nSequence: Step 1: 7 passes to 9, 7 moves back, D moves up the board; Step 2: 9 passes to 10, 9, D moves up the board; Step 3: 10 moves up the board, GK moves back.\nCoaching point: Taken five metres from the corner flag, so the first pass is already going forward. Standing over it while everyone jogs into place hands the defence the twenty seconds it needed.","noteZh":"【组织】3 对 3，球在 7 脚下。\n【球路】7 → 9 → 10\n【流程】第1步：7号球员把球传给9号球员，7号球员回撤移动，D向前移动；第2步：9号球员把球传给10号球员，9号球员、D向前移动；第3步：10号球员向前移动，GK回撤移动。\n【要点】在距角旗五米处开出，第一脚就已经是向前的。站在球边等所有人慢跑就位，等于白送给对方二十秒。","mistake":"Improvising a moment whose value was that it was rehearsed.","mistakeZh":"把价值在于排练的时刻临场发挥。","category":"setpiece","level":"development","minutes":8,"players":6,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"10","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"4 处球员重叠：第 1 步 7+D（相距 49）；第 2 步 7+D（相距 49）；第 3 步 7+D（相距 49）；第 3 步 10+D（相距 47）"}]},{"sport":"fieldHockey","id":"fh_counter_attack","name":"Counter-attack","nameZh":"快速反击","note":"Setup: 4 v 3, ball with 5.\nBall path: 5 → 9 → goal\nSequence: Step 1: 5 moves up the board; Step 2: 5 passes to 9, 11, 9, D moves up the board; Step 3: 9 carries the ball on the move, 9 shoots, 7, D moves up the board, GK moves back.\nCoaching point: Three passes to the circle, not five. Every extra touch is a defender getting back, and hockey's defenders get back very fast.","noteZh":"【组织】4 对 3，球在 5 脚下。\n【球路】5 → 9 → 球门\n【流程】第1步：5号球员向前移动；第2步：5号球员把球传给9号球员，11号球员、9号球员、D向前移动；第3步：9号球员带球推进，9号球员起脚射门，7号球员、D向前移动，GK回撤移动。\n【要点】三脚球进圈，不是五脚。每多碰一下，就多一个回防到位的人——曲棍球的回防非常快。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"advanced","minutes":12,"players":7,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"d2","k":"player","l":"9","m":"none"},{"id":"d3","k":"player","l":"7","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"D","m":"none"},{"id":"d6","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_gk_angles","name":"Goalkeeping angles","nameZh":"门将训练 角度选位","note":"Setup: 2 v 1, ball with 1.\nBall path: 1 → goal\nSequence: Step 1: 1, 2 moves up the board; Step 2: 1 shoots, GK moves left.\nCoaching point: Come off the line early and small, not late and big. Two metres out takes half the goal away before the shot is even hit.","noteZh":"【组织】2 对 1，球在 1 脚下。\n【球路】1 → 球门\n【流程】第1步：1号球员、2号球员向前移动；第2步：1号球员起脚射门，GK向左移动。\n【要点】早出门线、身形收紧，不要等到最后再张开。出来两米，射门还没打出去就已经封掉半个门。","mistake":"Going to ground early — once you are down the shooter has the whole top of the goal and all the time he wants.","mistakeZh":"过早倒地——一旦你躺下，整个上半门和所有时间都归射门的人了。","category":"goalkeeping","level":"foundation","minutes":10,"players":3,"family":{"en":"Goalkeeping","en-GB":"Goalkeeping","es-ES":"Porteria","fr-FR":"Gardien de but","id-ID":"Latihan kiper","ja-JP":"GK練習","ko-KR":"골키퍼 훈련","ms-MY":"Latihan penjaga gol","th-TH":"ฝึกผู้รักษาประตู","vi-VN":"Tap thu mon","zh-CN":"门将训练","zh-TW":"門將訓練"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_gk_first_save","name":"Goalkeeping the first save and the rebound","nameZh":"门将训练 第一次扑救与补射","note":"Setup: 2 v 1, ball with 1.\nBall path: 1 → goal\nSequence: Step 1: 1 moves up the board; Step 2: 1 shoots, GK moves back; Step 3: 2 moves up the board.\nCoaching point: Come off the line early and small, not late and big. Two metres out takes half the goal away before the shot is even hit.","noteZh":"【组织】2 对 1，球在 1 脚下。\n【球路】1 → 球门\n【流程】第1步：1号球员向前移动；第2步：1号球员起脚射门，GK回撤移动；第3步：2号球员向前移动。\n【要点】早出门线、身形收紧，不要等到最后再张开。出来两米，射门还没打出去就已经封掉半个门。","mistake":"Going to ground early — once you are down the shooter has the whole top of the goal and all the time he wants.","mistakeZh":"过早倒地——一旦你躺下，整个上半门和所有时间都归射门的人了。","category":"goalkeeping","level":"development","minutes":10,"players":3,"family":{"en":"Goalkeeping","en-GB":"Goalkeeping","es-ES":"Porteria","fr-FR":"Gardien de but","id-ID":"Latihan kiper","ja-JP":"GK練習","ko-KR":"골키퍼 훈련","ms-MY":"Latihan penjaga gol","th-TH":"ฝึกผู้รักษาประตู","vi-VN":"Tap thu mon","zh-CN":"门将训练","zh-TW":"門將訓練"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"fieldHockey","id":"fh_gk_one_v_one","name":"Goalkeeping one against one","nameZh":"门将训练 一对一","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → goal\nSequence: Step 1: 1 moves up the board; Step 2: 1 shoots, GK moves back.\nCoaching point: Come off the line early and small, not late and big. Two metres out takes half the goal away before the shot is even hit.","noteZh":"【组织】1 对 1，球在 1 脚下。\n【球路】1 → 球门\n【流程】第1步：1号球员向前移动；第2步：1号球员起脚射门，GK回撤移动。\n【要点】早出门线、身形收紧，不要等到最后再张开。出来两米，射门还没打出去就已经封掉半个门。","mistake":"Going to ground early — once you are down the shooter has the whole top of the goal and all the time he wants.","mistakeZh":"过早倒地——一旦你躺下，整个上半门和所有时间都归射门的人了。","category":"goalkeeping","level":"development","minutes":10,"players":2,"family":{"en":"Goalkeeping","en-GB":"Goalkeeping","es-ES":"Porteria","fr-FR":"Gardien de but","id-ID":"Latihan kiper","ja-JP":"GK練習","ko-KR":"골키퍼 훈련","ms-MY":"Latihan penjaga gol","th-TH":"ฝึกผู้รักษาประตู","vi-VN":"Tap thu mon","zh-CN":"门将训练","zh-TW":"門將訓練"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 1+GK（相距 47）"}]},{"sport":"fieldHockey","id":"fh_gk_clearing","name":"Goalkeeping clearing the circle","nameZh":"门将训练 解围出圈","note":"Setup: 2 v 1, ball with 1.\nBall path: 1 → goal\nSequence: Step 1: 1, 2 moves up the board; Step 2: 1 shoots, GK moves back.\nCoaching point: Come off the line early and small, not late and big. Two metres out takes half the goal away before the shot is even hit.","noteZh":"【组织】2 对 1，球在 1 脚下。\n【球路】1 → 球门\n【流程】第1步：1号球员、2号球员向前移动；第2步：1号球员起脚射门，GK回撤移动。\n【要点】早出门线、身形收紧，不要等到最后再张开。出来两米，射门还没打出去就已经封掉半个门。","mistake":"Going to ground early — once you are down the shooter has the whole top of the goal and all the time he wants.","mistakeZh":"过早倒地——一旦你躺下，整个上半门和所有时间都归射门的人了。","category":"goalkeeping","level":"development","minutes":10,"players":3,"family":{"en":"Goalkeeping","en-GB":"Goalkeeping","es-ES":"Porteria","fr-FR":"Gardien de but","id-ID":"Latihan kiper","ja-JP":"GK練習","ko-KR":"골키퍼 훈련","ms-MY":"Latihan penjaga gol","th-TH":"ฝึกผู้รักษาประตู","vi-VN":"Tap thu mon","zh-CN":"门将训练","zh-TW":"門將訓練"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_warm_juggling_in_pairs","name":"Warm-up juggling in pairs","nameZh":"热身 两人颠球","note":"Setup: 2 players, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1, 2 moves up the board; Step 2: 2 plays it to 1.\nCoaching point: Kill the ball dead on the first touch. In sand you cannot chase a bad control, so the control is the whole skill.","noteZh":"【组织】2 人，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员、2号球员向前移动；第2步：2号球员 打向 1号球员。\n【要点】第一脚要把球彻底停死。沙地上追不了停坏的球，所以停球本身就是全部技术。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_warm_on_every_surface","name":"Warm-up on every surface","nameZh":"热身 全部位触球","note":"Setup: 3 players, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 plays it to 2, 1 moves up the board; Step 2: 2 plays it to 3, 2 moves up the board; Step 3: 3 moves up the board.\nCoaching point: Kill the ball dead on the first touch. In sand you cannot chase a bad control, so the control is the whole skill.","noteZh":"【组织】3 人，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员 打向 2号球员，1号球员向前移动；第2步：2号球员 打向 3号球员，2号球员向前移动；第3步：3号球员向前移动。\n【要点】第一脚要把球彻底停死。沙地上追不了停坏的球，所以停球本身就是全部技术。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":3,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_control_chest_control","name":"Ball control with the chest","nameZh":"控球 胸部停球","note":"Setup: 2 v 1.\nBall path: F → 1\nSequence: Step 1: the ball is played to F, 1 moves left, F moves back; Step 2: F plays it to 1, 2 moves up the board.\nCoaching point: Three touches and no hands: the first one has to end up somewhere your partner can actually set from, not just somewhere on your side.","noteZh":"【组织】2 对 1。\n【球路】F → 1\n【流程】第1步：球被传给F，1号球员向左移动，F回撤移动；第2步：F 打向 1号球员，2号球员向前移动。\n【要点】三次触球、不能用手：第一下必须停到同伴真能传球的位置，而不只是停在自己这半场某个地方。","mistake":"A first touch that lands anywhere on your side, not where the setter can use it.","mistakeZh":"第一脚停在本方随便一处，不是二传用得上的位置。","category":"possession","level":"development","minutes":10,"players":3,"family":{"en":"Ball control","en-GB":"Ball control","es-ES":"Control","fr-FR":"Contrôle","id-ID":"Kontrol bola","ja-JP":"ボールコントロール","ko-KR":"볼 컨트롤","ms-MY":"Kawalan bola","th-TH":"การคุมบอล","vi-VN":"Khống chế bóng","zh-CN":"控球","zh-TW":"控球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_control_the_shoulder_pass","name":"Ball control the shoulder pass","nameZh":"控球 肩传","note":"Setup: 2 v 1.\nBall path: F → 1\nSequence: Step 1: the ball is played to F, 1 moves up the board, F moves back; Step 2: F plays it to 1, 2 moves up the board.\nCoaching point: Three touches and no hands: the first one has to end up somewhere your partner can actually set from, not just somewhere on your side.","noteZh":"【组织】2 对 1。\n【球路】F → 1\n【流程】第1步：球被传给F，1号球员向前移动，F回撤移动；第2步：F 打向 1号球员，2号球员向前移动。\n【要点】三次触球、不能用手：第一下必须停到同伴真能传球的位置，而不只是停在自己这半场某个地方。","mistake":"A first touch that lands anywhere on your side, not where the setter can use it.","mistakeZh":"第一脚停在本方随便一处，不是二传用得上的位置。","category":"possession","level":"development","minutes":10,"players":3,"family":{"en":"Ball control","en-GB":"Ball control","es-ES":"Control","fr-FR":"Contrôle","id-ID":"Kontrol bola","ja-JP":"ボールコントロール","ko-KR":"볼 컨트롤","ms-MY":"Kawalan bola","th-TH":"การคุมบอล","vi-VN":"Khống chế bóng","zh-CN":"控球","zh-TW":"控球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_control_the_high_feed","name":"Ball control high","nameZh":"控球 高传","note":"Setup: 2 v 1.\nBall path: F → 1\nSequence: Step 1: the ball is played to F, 1 moves up the board, F moves back; Step 2: F plays it to 1, 2 moves up the board.\nCoaching point: Three touches and no hands: the first one has to end up somewhere your partner can actually set from, not just somewhere on your side.","noteZh":"【组织】2 对 1。\n【球路】F → 1\n【流程】第1步：球被传给F，1号球员向前移动，F回撤移动；第2步：F 打向 1号球员，2号球员向前移动。\n【要点】三次触球、不能用手：第一下必须停到同伴真能传球的位置，而不只是停在自己这半场某个地方。","mistake":"A first touch that lands anywhere on your side, not where the setter can use it.","mistakeZh":"第一脚停在本方随便一处，不是二传用得上的位置。","category":"possession","level":"development","minutes":10,"players":3,"family":{"en":"Ball control","en-GB":"Ball control","es-ES":"Control","fr-FR":"Contrôle","id-ID":"Kontrol bola","ja-JP":"ボールコントロール","ko-KR":"볼 컨트롤","ms-MY":"Kawalan bola","th-TH":"การคุมบอล","vi-VN":"Khống chế bóng","zh-CN":"控球","zh-TW":"控球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_receive_chest","name":"Receiving with the chest","nameZh":"一传 胸部停球","note":"Setup: 2 v 1.\nBall path: S → 1\nSequence: Step 1: the ball is played to S, 1 moves up the board, S moves back; Step 2: S plays it to 1, 2 moves left.\nCoaching point: Take the serve on the surface it arrives at — chest for the flat one, thigh for the dipping one. Changing surface mid-flight is how the first touch flies to the crowd.","noteZh":"【组织】2 对 1。\n【球路】S → 1\n【流程】第1步：球被传给S，1号球员向前移动，S回撤移动；第2步：S 打向 1号球员，2号球员向左移动。\n【要点】球到哪个部位就用哪个部位接——平球用胸，下坠球用大腿。球飞到一半换部位，一传就飞进观众席了。","mistake":"Changing surface mid-flight — the first touch flies to the crowd.","mistakeZh":"球飞到一半换部位——一传飞进观众席。","category":"possession","level":"foundation","minutes":10,"players":3,"family":{"en":"Receiving","en-GB":"Receiving","es-ES":"Recepción","fr-FR":"Réception","id-ID":"Menerima","ja-JP":"レシーブ","ko-KR":"리시브","ms-MY":"Menerima","th-TH":"การรับลูกแรก","vi-VN":"Bước một","zh-CN":"一传","zh-TW":"一傳"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"S","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_receive_thigh","name":"Receiving with the thigh","nameZh":"一传 大腿停球","note":"Setup: 2 v 1.\nBall path: S → 1\nSequence: Step 1: the ball is played to S, 1 moves up the board, S moves back; Step 2: S plays it to 1, 2 moves up the board.\nCoaching point: Take the serve on the surface it arrives at — chest for the flat one, thigh for the dipping one. Changing surface mid-flight is how the first touch flies to the crowd.","noteZh":"【组织】2 对 1。\n【球路】S → 1\n【流程】第1步：球被传给S，1号球员向前移动，S回撤移动；第2步：S 打向 1号球员，2号球员向前移动。\n【要点】球到哪个部位就用哪个部位接——平球用胸，下坠球用大腿。球飞到一半换部位，一传就飞进观众席了。","mistake":"Changing surface mid-flight — the first touch flies to the crowd.","mistakeZh":"球飞到一半换部位——一传飞进观众席。","category":"possession","level":"development","minutes":10,"players":3,"family":{"en":"Receiving","en-GB":"Receiving","es-ES":"Recepción","fr-FR":"Réception","id-ID":"Menerima","ja-JP":"レシーブ","ko-KR":"리시브","ms-MY":"Menerima","th-TH":"การรับลูกแรก","vi-VN":"Bước một","zh-CN":"一传","zh-TW":"一傳"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"S","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_serve_long_and_fast","name":"Serve long and fast","nameZh":"发球 长且快","note":"Setup: 1 v 2, ball with S.\nBall path: S → R → S\nSequence: Step 1: S plays it to R, S moves up the board; Step 2: R plays it to S, R moves up the board.\nCoaching point: A serve they have to take on the chest is worth two they take on the foot. Height is the weapon here, not power.","noteZh":"【组织】1 对 2，球在 S 脚下。\n【球路】S → R → S\n【流程】第1步：S 打向 R，S向前移动；第2步：R 打向 S，R向前移动。\n【要点】逼对手用胸口接的发球，抵得上两个让他用脚接的。这里的武器是高度，不是力量。","mistake":"A serve they take on the foot — height is the weapon here, not power.","mistakeZh":"让对手用脚接的发球——这里的武器是高度，不是力量。","category":"setpiece","level":"development","minutes":8,"players":3,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao bóng","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"d2","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_serve_in_the_corner","name":"Serve in the corner","nameZh":"发球 角旗区","note":"Setup: 1 v 2, ball with S.\nBall path: S → R → S\nSequence: Step 1: S plays it to R, S moves up the board; Step 2: R plays it to S, R moves up the board.\nCoaching point: A serve they have to take on the chest is worth two they take on the foot. Height is the weapon here, not power.","noteZh":"【组织】1 对 2，球在 S 脚下。\n【球路】S → R → S\n【流程】第1步：S 打向 R，S向前移动；第2步：R 打向 S，R向前移动。\n【要点】逼对手用胸口接的发球，抵得上两个让他用脚接的。这里的武器是高度，不是力量。","mistake":"A serve they take on the foot — height is the weapon here, not power.","mistakeZh":"让对手用脚接的发球——这里的武器是高度，不是力量。","category":"setpiece","level":"development","minutes":8,"players":3,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao bóng","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"d2","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_serve_at_the_seam","name":"Serve at the seam","nameZh":"发球 打结合部","note":"Setup: 1 v 2, ball with S.\nBall path: S → R → S\nSequence: Step 1: S plays it to R, S moves up the board; Step 2: R plays it to S, R moves right.\nCoaching point: A serve they have to take on the chest is worth two they take on the foot. Height is the weapon here, not power.","noteZh":"【组织】1 对 2，球在 S 脚下。\n【球路】S → R → S\n【流程】第1步：S 打向 R，S向前移动；第2步：R 打向 S，R向右移动。\n【要点】逼对手用胸口接的发球，抵得上两个让他用脚接的。这里的武器是高度，不是力量。","mistake":"A serve they take on the foot — height is the weapon here, not power.","mistakeZh":"让对手用脚接的发球——这里的武器是高度，不是力量。","category":"setpiece","level":"development","minutes":8,"players":3,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao bóng","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"d2","k":"player","l":"R","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_attack_the_shark_attack","name":"Setting up the shark attack","nameZh":"进攻 鲨鱼式扣杀","note":"Setup: 2 v 2, ball with 1.\nSequence: Step 1: 1, 2 moves up the board; Step 2: B moves back; Step 3: D moves back.\nCoaching point: The set decides the attack. A ball that drifts over the net gives away the only thing you had — the choice of where to put it.","noteZh":"【组织】2 对 2，球在 1 脚下。\n【流程】第1步：1号球员、2号球员向前移动；第2步：B回撤移动；第3步：D回撤移动。\n【要点】传球决定了进攻。传球飘过网，就把你唯一拥有的东西送掉了——选择落点的权利。","mistake":"A set that drifts over the net — you hand away the one thing you had, the choice.","mistakeZh":"传球飘过网——把你唯一的东西送掉：选择权。","category":"attacking","level":"advanced","minutes":12,"players":4,"family":{"en":"Setting up","en-GB":"Setting up","es-ES":"Ataque","fr-FR":"Attaque","id-ID":"Serangan","ja-JP":"攻撃","ko-KR":"공격","ms-MY":"Serangan","th-TH":"การบุก","vi-VN":"Tấn công","zh-CN":"进攻","zh-TW":"進攻"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"B","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"footvolley","id":"fv_attack_the_sombrero","name":"Setting up the sombrero","nameZh":"进攻 帽子过顶","note":"Setup: 2 v 2, ball with 1.\nSequence: Step 1: 1, 2 moves up the board; Step 3: D moves back.\nCoaching point: The set decides the attack. A ball that drifts over the net gives away the only thing you had — the choice of where to put it.","noteZh":"【组织】2 对 2，球在 1 脚下。\n【流程】第1步：1号球员、2号球员向前移动；第3步：D回撤移动。\n【要点】传球决定了进攻。传球飘过网，就把你唯一拥有的东西送掉了——选择落点的权利。","mistake":"A set that drifts over the net — you hand away the one thing you had, the choice.","mistakeZh":"传球飘过网——把你唯一的东西送掉：选择权。","category":"attacking","level":"advanced","minutes":12,"players":4,"family":{"en":"Setting up","en-GB":"Setting up","es-ES":"Ataque","fr-FR":"Attaque","id-ID":"Serangan","ja-JP":"攻撃","ko-KR":"공격","ms-MY":"Serangan","th-TH":"การบุก","vi-VN m":"none"},{"id":"d7","k":"player","l":"D","m":"none"},{"id":"d8","k":"player","l":"D","m":"none"},{"id":"d9","k":"player","l":"D","m":"none"},{"id":"d10","k":"player","l":"D","m":"none"},{"id":"d11","k":"player","l":"D","m":"none"},{"id":"d12","k":"player","l":"GK","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"12 处球员重叠：第 1 步 1+D（相距 14）；第 1 步 2+D（相距 13）；第 1 步 3+D（相距 14）；第 1 步 4+D（相距 14）；第 1 步 5+D（相距 14）；第 1 步 6+D（相距 13）；第 2 步 1+D（相距 14）；第 2 步 2+D（相距 13）；第 2 步 3+D（相距 14）；第 2 步 4+D（相距 14）；第 2 步 5+D（相距 14）；第 2 步 6+D（相距 13）"}]},{"sport":"handball","id":"hb_attack_one_v_one","name":"Attack one against one","nameZh":"进攻配合 一对一","note":"Setup: 1 v 2, ball with CB.\nBall path: CB → goal\nSequence: Step 1: CB carries the ball on the move, CB moves up the board, D moves left; Step 2: CB carries the ball on the move, GK moves right; Step 3: CB shoots.\nCoaching point: Change direction once, at speed, off the foot nearest the defender. A feint he can watch you set up is not a feint.","noteZh":"【组织】1 对 2，球在 CB 脚下。\n【球路】CB → 球门\n【流程】第1步：CB带球推进，CB向前移动，D向左移动；第2步：CB带球推进，GK向右移动；第3步：CB起脚射门。\n【要点】全速中变向一次，用靠近防守人的那只脚蹬地。让他看着你做出来的假动作，不叫假动作。","mistake":"Forcing it early instead of waiting the half-second the opening needs.","mistakeZh":"过早强行出手，不等空当需要的那半秒。","category":"attacking","level":"foundation","minutes":10,"players":3,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"CB","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"handball","id":"hb_defence_man_to_man","name":"Defence man to man","nameZh":"防守阵型 盯人","note":"Setup: 6 v 7, ball with CB.\nBall path: CB → M → CB\nSequence: Step 1: CB throws to M, M moves up the board; Step 2: M throws to CB.\nCoaching point: The marker follows one man everywhere and the five behind him play a short 5-0. If the five drift to watch the marker, the system has cost you a defender instead of gaining one.","noteZh":"【组织】6 对 7，球在 CB 脚下。\n【球路】CB → M → CB\n【流程】第1步：CB 传给 M，M向前移动；第2步：M 传给 CB。\n【要点】盯人的那个全场跟死一个人，身后五个人打紧凑的 5-0。如果这五个人跟着去看盯人的，这套体系就不是多赚一个人，而是少了一个人。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"advanced","minutes":12,"players":13,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"LW","m":"none"},{"id":"d1","k":"player","l":"LB","m":"none"},{"id":"d2","k":"player","l":"CB","m":"none"},{"id":"d3","k":"player","l":"RB","m":"none"},{"id":"d4","k":"player","l":"RW","m":"none"},{"id":"d5","k":"player","l":"PIV","m":"none"},{"id":"d6","k":"player","l":"D","m":"none"},{"id":"d7","k":"player","l":"D","m":"none"},{"id":"d8","k":"player","l":"D","m":"none"},{"id":"d9","k":"player","l":"D","m":"none"},{"id":"d10","k":"player","l":"D","m":"none"},{"id":"d11","k":"player","l":"M","m":"none"},{"id":"d12","k":"player","l":"GK","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 CB+M（相距 22）；第 2 步 CB+M（相距 22）"}]},{"sport":"handball","id":"hb_defence_return","name":"Defence getting back","nameZh":"防守阵型 回防","note":"Setup: 3 v 4, ball with 2.\nBall path: 2 → D\nSequence: Step 1: 2 throws to D, 1, 2, 3, D, D, D moves up the board; Step 2: D carries the ball on the move.\nCoaching point: Sprint to the six metre line first and sort out who marks whom there. Running back watching the ball is how a five-on-four becomes a goal.","noteZh":"【组织】3 对 4，球在 2 脚下。\n【球路】2 → D\n【流程】第1步：2号球员 传给 D，1号球员、2号球员、3号球员、D、D、D向前移动；第2步：D带球推进。\n【要点】先冲回 6 米线，回到位再分谁盯谁。一边往回跑一边看球，五打四就是这样变成一个球的。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"development","minutes":10,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l": traint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"advanced","minutes":18,"players":8,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"GK","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"D","m":"none"},{"id":"d6","k":"player","l":"D","m":"none"},{"id":"d7","k":"player","l":"GK","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"handball","id":"hb_gk_angles","name":"Goalkeeping angles","nameZh":"门将训练 角度选位","note":"Setup: 2 v 1, ball with 1.\nBall path: 1 → goal\nSequence: Step 1: 1, 2 moves up the board; Step 2: 1 shoots, GK moves left.\nCoaching point: Move on the shooter's plant foot, not on the ball. By the time you can see the ball the ball has already been thrown.","noteZh":"【组织】2 对 1，球在 1 脚下。\n【球路】1 → 球门\n【流程】第1步：1号球员、2号球员向前移动；第2步：1号球员起脚射门，GK向左移动。\n【要点】看射门者的支撑脚起动，不是看球。等你看得见球的时候，球已经出手了。","mistake":"Committing to a side before the arm comes through — a keeper already moving is a keeper already beaten.","mistakeZh":"手还没挥出来就先倒向一边——提前动的门将，等于已经被打穿了。","category":"goalkeeping","level":"foundation","minutes":10,"players":3,"family":{"en":"Goalkeeping","en-GB":"Goalkeeping","es-ES":"Porteria","fr-FR":"Gardien de but","id-ID":"Latihan kiper","ja-JP":"GK練習","ko-KR":"골키퍼 훈련","ms-MY":"Latihan penjaga gol","th-TH":"ฝึกผู้รักษาประตู","vi-VN":"Tap thu mon","zh-CN":"门将训练","zh-TW":"門將訓練"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"handball","id":"hb_gk_one_v_one","name":"Goalkeeping one against one","nameZh":"门将训练 一对一","note":"Setup: 1 v 1, ball with 1.\nBall path: 1 → oulder they can't reach across. Speeding up a low ball starts a fight you're losing.","noteZh":"【组织】2 对 2，1 个锥标，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A；第2步：A 打向 1号球员，1号球员向前移动；第3步：A向左移动。\n【要点】只打高过网的球，打向对手够不到的那侧肩膀。把低球加速，等于主动开启一场你处于下风的对轰。","mistake":"Speeding up a low ball — you start a firefight from underneath.","mistakeZh":"把低球加速——从下风位置主动开打。","category":"attacking","level":"development","minutes":10,"players":4,"family":{"en":"Speed-up","en-GB":"Speed-up","es-ES":"Aceleración","fr-FR":"Accélération","id-ID":"Percepatan","ja-JP":"スピードアップ","ko-KR":"스피드업","ms-MY":"Pecutan","th-TH":"การเร่งจังหวะ","vi-VN":"Tăng tốc","zh-CN":"突然加速","zh-TW":"突然加速"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"A","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 3 步 A+B（相距 36）"}]},{"sport":"pickleball","id":"pb_speedup_hip","name":"Speed-up at the hip","nameZh":"突然加速 打髋部","note":"Setup: 2 v 2, 1 cones, ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A; Step 2: A plays it to 1, 1 moves up the board; Step 3: A moves left.\nCoaching point: Attack the ball that is above the net, at the shoulder they can't reach across. Speeding up a low ball starts a fight you're losing.","noteZh":"【组织】2 对 2，1 个锥标，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A；第2步：A 打向 1号球员，1号球员向前移动；第3步：A向左移动。\n【要点】只打高过网的球，打向对手够不到的那侧肩膀。把低球加速，等于主动开启一场你处于下风的对轰。","mistake":"Speeding up a low ball — you start a firefight from underneath.","mistakeZh":"把低球加速——从下风位置主动开打。","category":"attacking","level":"development","minutes":10,"players":4,"family":{"en":"Speed-up","en-GB":"Speed-up","es-ES":"Aceleración","fr-FR":"Accélération","id-ID":"Percepatan","ja-JP":"スピードアップ","ko-KR":"스피드업","ms-MY":"Pecutan","th-TH":"การเร่งจังหวะ","v
