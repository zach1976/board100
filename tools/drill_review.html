【组织】2 对 2，2 个锥标。\n【球路】A\n【流程】第1步：球被传给A，D、D向前移动；第2步：A带球推进，A、A回撤移动。\n【要点】头贴在对手臀侧，肩顶大腿，接触瞬间抱紧。先用手去够的擒抱者，等于已经把自己的肩膀让出去了。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":12,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"D","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"A","m":"none"},{"id":"d3","k":"player","l":"A","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 D+A（完全重合）；第 2 步 D+A（完全重合）——后到者踩在还没让开的位置上"}]},{"sport":"rugby","id":"rg_kick_high_ball","name":"The high ball the contest and the counter","nameZh":"高球争顶 争顶与反击","note":"Setup: 3 v 3.\nSequence: Step 1: 10 moves back; Step 2: 15 moves up the board, C, C moves back; Step 3: 11, 14 moves up the board.\nCoaching point: Call it early, jump off one foot with the knee up, and catch it above the head rather than at the chest. The chest catch is the one the chaser knocks loose.","noteZh":"【组织】3 对 3。\n【流程】第1步：10号球员回撤移动；第2步：15号球员向前移动，C、C回撤移动；第3步：11号球员、14号球员向前移动。\n【要点】早喊，单脚起跳、抬起护膝，把球接在头顶上方而不是胸前。胸前接的那个球，就是被追防的人撞掉的那个。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"development","minutes":12,"players":6,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"15","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"d2","k":"player","l":"14","m":"none"},{"id":"d3","k":"player","l":"10","m":"none"},{"id":"d4","k":"player","l":"C","m":"none"},{"id":"d5","k":"player","l":"C","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 15+C（相距 57）"}]},{"sport":"rugby","id":"rg_kick_at_goal","name":"Place kicking the routine","nameZh":"定位球射门 固定流程","note":"Setup: 1 players.\nSequence: Step 1: 10 moves back.\nCoaching point: The routine is the skill: same steps back, same steps across, same time over the ball whether it is the first minute or the last kick of the match.","noteZh":"【组织】1 人。\n【流程】第1步：10号球员回撤移动。\n【要点】流程本身就是技术：后退几步、横移几步、在球前停留多久，第一分钟和最后一脚都必须一模一样。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"foundation","minutes":10,"players":1,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"10","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"rugby","id":"rg_kick_exit","name":"Exit from your own 22 two phases and the kick","nameZh":"本方 22 米区出球 两波次后开踢","note":"Setup: 4 v 3, ball with 9.\nSequence: Step 1: 9 moves right, 1 moves up the board; Step 2: 4 moves up the board, D, D moves back; Step 3: 10 moves left, 15 moves up the board.\nCoaching point: Two phases then the kick, and the kick goes to touch or to grass, never down the throat of the back three. A rushed exit is the try you concede two minutes later.","noteZh":"【组织】4 对 3，球在 9 脚下。\n【流程】第1步：9号球员向右移动，1号球员向前移动；第2步：4号球员向前移动，D、D回撤移动；第3步：10号球员向左移动，15号球员向前移动。\n【要点】打两个波次再踢，踢出界或踢到空当，绝不要正对着对方后三人踢。仓促出球，就是两分钟后丢的那个达阵。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"advanced","minutes":14,"players":7,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"9","m":"none"},{"id":"d1","k":"player","l":"1","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"10","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"D","m":"none"},{"id":"d6","k":"player","l":"15","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"9 处球员重叠：第 1 步 9+1（相距 31）；第 2 步 9+4（相距 60）；第 2 步 9+D（相距 58）；第 2 步 9+D（相距 58）；第 2 步 4+D（相距 48）；第 3 步 9+4（相距 60）；第 3 步 9+D（相距 58）；第 3 步 9+D（相距 58）；第 3 步 4+D（相距 48）"}]},{"sport":"sepakTakraw","id":"st_warm_juggling","name":"Warm-up juggling in pairs","nameZh":"热身 两人颠球","note":"Setup: 2 players, ball with 1.\nBall path: 1 → 2 → 1\nSequence: Step 1: 1 plays it to 2, 1, 2 moves up the board; Step 2: 2 plays it to 1.\nCoaching point: Touch the ball with every surface you are allowed — foot, knee, shoulder, head. In a rally you do not get to choose which one.","noteZh":"【组织】2 人，球在 1 脚下。\n【球路】1 → 2 → 1\n【流程】第1步：1号球员 打向 2号球员，1号球员、2号球员向前移动；第2步：2号球员 打向 1号球员。\n【要点】允许用的部位都要碰球——脚、膝、肩、头。真打起来的时候，由不得你挑。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_warm_all_surfaces","name":"Warm-up on every surface","nameZh":"热身 全部位触球","note":"Setup: 3 players, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 plays it to 2, 1 moves up the board; Step 2: 2 plays it to 3, 2 moves up the board; Step 3: 3 moves up the board.\nCoaching point: Touch the ball with every surface you are allowed — foot, knee, shoulder, head. In a rally you do not get to choose which one.","noteZh":"【组织】3 人，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员 打向 2号球员，1号球员向前移动；第2步：2号球员 打向 3号球员，2号球员向前移动；第3步：3号球员向前移动。\n【要点】允许用的部位都要碰球——脚、膝、肩、头。真打起来的时候，由不得你挑。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":3,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_warm_keep_up","name":"Warm-up keeping it up as three","nameZh":"热身 三人不落地","note":"Setup: 3 players, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 plays it to 2, 1 moves up the board; Step 2: 2 plays it to 3, 2 moves up the board; Step 3: 3 moves up the board.\nCoaching point: Touch the ball with every surface you are allowed — foot, knee, shoulder, head. In a rally you do not get to choose which one.","noteZh":"【组织】3 人，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员 打向 2号球员，1号球员向前移动；第2步：2号球员 打向 3号球员，2号球员向前移动；第3步：3号球员向前移动。\n【要点】允许用的部位都要碰球——脚、膝、肩、头。真打起来的时候，由不得你挑。","mistake":"Going through the motions cold.","mistakeZh":"身体没热开就敷衍了事。","category":"warmup","level":"foundation","minutes":8,"players":3,"family":{"en":"Warm-up","en-GB":"Warm-up","es-ES":"Calentamiento","fr-FR":"Échauffement","id-ID":"Pemanasan","ja-JP":"ウォームアップ","ko-KR":"웜업","ms-MY":"Memanaskan badan","th-TH":"วอร์มอัพ","vi-VN":"Khởi động","zh-CN":"热身","zh-TW":"熱身"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_receive_left","name":"Serve receive on the left","nameZh":"接发球 左侧","note":"Setup: 3 v 1.\nBall path: T → 1\nSequence: Step 1: the ball is played to T, 1 moves up the board, T moves back; Step 2: T plays it to 1, 2 moves left, T moves up the board.\nCoaching point: Receive with the inside of the foot and cushion upward — the first touch has to hang long enough for the feeder to reach it.","noteZh":"【组织】3 对 1。\n【球路】T → 1\n【流程】第1步：球被传给T，1号球员向前移动，T回撤移动；第2步：T 打向 1号球员，2号球员向左移动，T向前移动。\n【要点】用脚内侧接，向上卸力——一传要在空中停留得够久，让二传的人来得及赶到。","mistake":"A flat first touch — cushion upward so the feeder can reach it.","mistakeZh":"一传停平了——要向上卸力，让二传赶得到。","category":"possession","level":"development","minutes":10,"players":4,"family":{"en":"Serve receive","en-GB":"Serve receive","es-ES":"Recepción de saque por","fr-FR":"Réception de service à","id-ID":"Terima servis sisi","ja-JP":"サーブレシーブ","ko-KR":"서브 리시브","ms-MY":"Terima servis sebelah","th-TH":"การรับเสิร์ฟ","vi-VN":"Đỡ giao cầu bên","zh-CN":"接发球","zh-TW":"接發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"T","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_receive_right","name":"Serve receive on the right","nameZh":"接发球 右侧","note":"Setup: 3 v 1.\nBall path: T → 1\nSequence: Step 1: the ball is played to T, 1 moves up the board, T moves back; Step 2: T plays it to 1, 2 moves right, T moves up the board.\nCoaching point: Receive with the inside of the foot and cushion upward — the first touch has to hang long enough for the feeder to reach it.","noteZh":"【组织】3 对 1。\n【球路】T → 1\n【流程】第1步：球被传给T，1号球员向前移动，T回撤移动；第2步：T 打向 1号球员，2号球员向右移动，T向前移动。\n【要点】用脚内侧接，向上卸力——一传要在空中停留得够久，让二传的人来得及赶到。","mistake":"A flat first touch — cushion upward so the feeder can reach it.","mistakeZh":"一传停平了——要向上卸力，让二传赶得到。","category":"possession","level":"development","minutes":10,"players":4,"family":{"en":"Serve receive","en-GB":"Serve receive","es-ES":"Recepción de saque por","fr-FR":"Réception de service à","id-ID":"Terima servis sisi","ja-JP":"サーブレシーブ","ko-KR":"서브 리시브","ms-MY":"Terima servis sebelah","th-TH":"การรับเสิร์ฟ","vi-VN":"Đỡ giao cầu bên","zh-CN":"接发球","zh-TW":"接發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"T","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_feed_receiving_the_serve","name":"Feeding off the serve","nameZh":"传球 接发球","note":"Setup: 3 v 1.\nBall path: T → R\nSequence: Step 1: the ball is played to T, R moves up the board, T moves back; Step 2: T plays it to R, F moves right; Step 3: S moves up the board.\nCoaching point: Feed the ball where the striker's foot will be, not where they are. A perfect height in the wrong place is still a wasted point.","noteZh":"【组织】3 对 1。\n【球路】T → R\n【流程】第1步：球被传给T，R向前移动，T回撤移动；第2步：T 打向 R，F向右移动；第3步：S向前移动。\n【要点】把球传到扣球手的脚将要到的位置，不是他现在站的位置。高度再完美，位置不对，这一分照样浪费。","mistake":"Feeding where the striker is, not where his foot will be — perfect height, wrong place.","mistakeZh":"把球传到扣球手现在的位置，不是脚将到的位置——高度对，位置错。","category":"possession","level":"development","minutes":10,"players":4,"family":{"en":"Feeding","en-GB":"Feeding","es-ES":"El pase","fr-FR":"La passe","id-ID":"Umpan","ja-JP":"トス","ko-KR":"토스","ms-MY":"Umpanan","th-TH":"การชง","vi-VN":"Đường chuyền","zh-CN":"传球","zh-TW":"傳球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"R","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"S","m":"none"},{"id":"d3","k":"player","l":"T","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_feed_the_high_feed","name":"Feeding high","nameZh":"传球 高传","note":"Setup: 3 v 1.\nBall path: T → R\nSequence: Step 1: the ball is played to T, R moves up the board, T moves back; Step 2: T plays it to R, F moves up the board; Step 3: S moves up the board.\nCoaching point: Feed the ball where the striker's foo d":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 3 步 B+D（相距 53）"}]},{"sport":"sepakTakraw","id":"st_spike_roll","name":"Spiking the roll","nameZh":"扣球 转体倒钩","note":"Setup: 2 v 2, ball with F.\nSequence: Step 1: F moves right; Step 2: S moves up the board, B moves left; Step 3: D moves back.\nCoaching point: Get the foot above the ball — above the tape if you can — while the hips stay under it. Height comes from the jump, not from kicking harder at the top.","noteZh":"【组织】2 对 2，球在 F 脚下。\n【流程】第1步：F向右移动；第2步：S向前移动，B向左移动；第3步：D回撤移动。\n【要点】起脚之前先把胯送到球上方。高度来自起跳，不是来自到了顶点再用力踢。","mistake":"Kicking from below the ball — get the hips above it before the foot swings.","mistakeZh":"在球下方起脚——起脚前先把胯送到球上方。","category":"finishing","level":"advanced","minutes":12,"players":4,"family":{"en":"Spiking","en-GB":"Spiking","es-ES":"Remate","fr-FR":"Attaque","id-ID":"Smes","ja-JP":"アタック","ko-KR":"스파이크","ms-MY":"Rejaman","th-TH":"การฟาด","vi-VN":"Đá tấn công","zh-CN":"扣球","zh-TW":"扣球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"B","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 S+F（相距 59）；第 3 步 S+F（相距 59）"}]},{"sport":"sepakTakraw","id":"st_spike_scissor","name":"Spiking the scissor kick","nameZh":"扣球 剪刀腿扣杀","note":"Setup: 2 v 2, ball with F.\nSequence: Step 1: F moves right; Step 2: S moves up the board, B moves left; Step 3: D moves back.\nCoaching point: Get the foot above the ball — above the tape if you can — while the hips stay under it. Height comes from the jump, not from kicking harder at the top.","noteZh":"【组织】2 对 2，球在 F 脚下。\n【流程】第1步：F向右移动；第2步：S向前移动，B向左移动；第3步：D回撤移动。\n【要点】起脚之前先把胯送到球上方。高度来自起跳，不是来自到了顶点再用力踢。","mistake":"Kicking from below the ball — get the hips above it before the foot swings.","mistakeZh":"在球下方起脚——起脚前先把胯送到球上方。","category":"finishing","level":"advanced","minutes":12,"players":4,"family":{"en":"Spiking","en-GB":"Spiking","es-ES":"Remate","fr-FR":"Attaque","id-ID":"Smes","ja-JP":"アタック","ko-KR":"스파이크","ms-MY":"Rejaman","th-TH":"การฟาด","vi-VN":"Đá tấn công","zh-CN":"扣球","zh-TW":"扣球"},"tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"B","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_spike_sunback","name":"Spiking the sunback","nameZh":"扣球 背向倒挂","note":"Setup: 2 v 2, ball with F.\nSequence: Step 1: F moves right; Step 2: S, B moves up the board; Step 3: D moves back.\nCoaching point: Back to the net, and the strike goes over your own shoulder — so the set has to be behind you, not in front. Turning to look for it is how the block gets there first.","noteZh":"【组织】2 对 2，球在 F 脚下。\n【流程】第1步：F向右移动；第2步：S、B向前移动；第3步：D回撤移动。\n【要点】背对球网，从自己肩上把球踢出去——所以二传要送到你身后，不是身前。回头去找球的那一下，就是拦网先到的原因。","mistake":"Deciding late — the finish is chosen before the ball arrives, not after.","mistakeZh":"决定得太晚——终结在球到之前就该定好。","category":"finishing","level":"advanced","minutes":12,"players":4,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"B","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_defence_at_the_net","name":"Defending at the net","nameZh":"防守 网前","note":"Setup: 3 v 2, ball with D.\nBall path: D → S → B\nSequence: Step 1: D plays it to S, F moves back; Step 2: S plays it to B, B moves right, D, S moves back, T moves left.\nCoaching point: The blocker turns their back and the two behind cover what the block leaves. Nobody defends a takraw spike by reacting to it.","noteZh":"【组织】3 对 2，球在 D 脚下。\n【球路】D → S → B\n【流程】第1步：D 打向 S，F回撤移动；第2步：S 打向 B，B向右移动，D、S回撤移动，T向左移动。\n【要点】拦网的人转身用背，后面两个人补拦网留下的空当。没有人是靠反应去防藤球扣杀的。","mistake":"Reacting to the spike instead of reading the setter — nobody digs a takraw kill by reflex.","mistakeZh":"对着扣杀做反应而不是读二传——藤球扣死没人靠反射救得起。","category":"defending","level":"development","minutes":10,"players":5,"family":{"en":"Defending","en-GB":"Defending","es-ES":"Defensa","fr-FR":"Défense","id-ID":"Bertahan","ja-JP":"ディフェンス","ko-KR":"수비","ms-MY":"Pertahanan","th-TH":"การรับ","vi-VN":"Phòng thủ","zh-CN":"防守","zh-TW":"防守"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"S","m":"none"},{"id":"d4","k":"player","l":"F","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_defence_behind_the_block","name":"Defending behind the block","nameZh":"防守 拦网身后","note":"Setup: 3 v 2, ball with D.\nBall path: D → S → B\nSequence: Step 1: D plays it to S, F moves back; Step 2: S plays it to B, B moves up the board, D, S moves back, T moves left.\nCoaching point: The blocker turns their back and the two behind cover what the block leaves. Nobody defends a takraw spike by reacting to it.","noteZh":"【组织】3 对 2，球在 D 脚下。\n【球路】D → S → B\n【流程】第1步：D 打向 S，F回撤移动；第2步：S 打向 B，B向前移动，D、S回撤移动，T向左移动。\n【要点】拦网的人转身用背，后面两个人补拦网留下的空当。没有人是靠反应去防藤球扣杀的。","mistake":"Reacting to the spike instead of reading the setter — nobody digs a takraw kill by reflex.","mistakeZh":"对着扣杀做反应而不是读二传——藤球扣死没人靠反射救得起。","category":"defending","level":"development","minutes":10,"players":5,"family":{"en":"Defending","en-GB":"Defending","es-ES":"Defensa","fr-FR":"Défense","id-ID":"Bertahan","ja-JP":"ディフェンス","ko-KR":"수비","ms-MY":"Pertahanan","th-TH":"การรับ","vi-VN":"Phòng thủ","zh-CN":"防守","zh-TW":"防守"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"S","m":"none"},{"id":"d4","k":"player","l":"F","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_defence_covering_the_block","name":"Defending covering the block","nameZh":"防守 保护拦网","note":"Setup: 3 v 2, ball with D.\nBall path: D → S → B\nSequence: Step 1: D plays it to S, F moves back; Step 2: S plays it to B, B moves up the board, D, S moves back, T moves left.\nCoaching point: The blocker turns their back and the two behind cover what the block leaves. Nobody defends a takraw spike by reacting to it.","noteZh":"【组织】3 对 2，球在 D 脚下。\n【球路】D → S → B\n【流程】第1步：D 打向 S，F回撤移动；第2步：S 打向 B，B向前移动，D、S回撤移动，T向左移动。\n【要点】拦网的人转身用背，后面两个人补拦网留下的空当。没有人是靠反应去防藤球扣杀的。","mistake":"Reacting to the spike instead of reading the setter — nobody digs a takraw kill by reflex.","mistakeZh":"对着扣杀做反应而不是读二传——藤球扣死没人靠反射救得起。","category":"defending","level":"development","minutes":10,"players":5,"family":{"en":"Defending","en-GB":"Defending","es-ES":"Defensa","fr-FR":"Défense","id-ID":"Bertahan","ja-JP":"ディフェンス","ko-KR":"수비","ms-MY":"Pertahanan","th-TH":"การรับ","vi-VN":"Phòng thủ","zh-CN":"防守","zh-TW":"防守"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"D","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"S","m":"none"},{"id":"d4","k":"player","l":"F","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_cover_spike","name":"Covering the spike behind your own attack","nameZh":"保护补位 攻手身后","note":"Setup: 3 v 1, ball with S.\nBall path: S → B → S\nSequence: Step 1: S plays it to B; Step 2: B plays it to S, S runs up to take B's position, F moves right, T moves up the board.\nCoaching point: The block sends the ball straight down on your own side more often than over — two players crouch under your own spiker, every time.","noteZh":"【组织】3 对 1，球在 S 脚下。\n【球路】S → B → S\n【流程】第1步：S 打向 B；第2步：B 打向 S，S跑位到B的位置，F向右移动，T向前移动。\n【要点】被拦回来的球多数直坠在本方场内——每一次进攻，都要有两个人蹲在自己攻手身后。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"development","minutes":10,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"S","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"B","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_game_regu","name":"Game full regu","nameZh":"对抗 整队对抗","note":"Setup: 3 v 3, ball with T.\nBall path: T → L\nSequence: Step 1: T plays it to L, T moves up the board, T moves back; Step 2: L plays it to L.\nCoaching point: Three touches, three players, one rally. Take the block away and the attackers have to learn to place the ball instead of hitting it.","noteZh":"【组织】3 对 3，球在 T 脚下。\n【球路】T → L\n【流程】第1步：T 打向 L，T向前移动，T回撤移动；第2步：L 打向 L。\n【要点】三次触球，三个人，一个回合。把拦网去掉，进攻手就必须学会把球放到位置，而不是一味砸。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"development","minutes":20,"players":6,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"L","m":"none"},{"id":"d1","k":"player","l":"R","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"d3","k":"player","l":"L","m":"none"},{"id":"d4","k": ——那里谁都接得到。","mistake":"Serving to the middle where anyone reaches it — go at the weak surface.","mistakeZh":"发到谁都够得到的中间——要打对手不擅长的部位。","category":"setpiece","level":"advanced","minutes":8,"players":4,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao cầu","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"T","m":"none"},{"id":"d1","k":"player","l":"L","m":"none"},{"id":"d2","k":"player","l":"R","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"circle"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_serve_short","name":"Serve short","nameZh":"发球 短球","note":"Setup: 3 v 1, ball with T.\nBall path: T → D → T\nSequence: Step 1: T plays it to D, L moves right, R moves left; Step 2: D plays it to T, T moves up the board, D moves back.\nCoaching point: The tekong's serve is the only attack nobody blocks. Serve at a receiver's weak surface, not into the middle where anyone can take it.","noteZh":"【组织】3 对 1，球在 T 脚下。\n【球路】T → D → T\n【流程】第1步：T 打向 D，L向右移动，R向左移动；第2步：D 打向 T，T向前移动，D回撤移动。\n【要点】发球手的发球是唯一没人拦的进攻。要发向接球人不擅长的部位，不要发到中间——那里谁都接得到。","mistake":"Serving to the middle where anyone reaches it — go at the weak surface.","mistakeZh":"发到谁都够得到的中间——要打对手不擅长的部位。","category":"setpiece","level":"development","minutes":8,"players":4,"family":{"en":"Serve","en-GB":"Serve","es-ES":"Saque","fr-FR":"Service","id-ID":"Servis","ja-JP":"サーブ","ko-KR":"서브","ms-MY":"Servis","th-TH":"การเสิร์ฟ","vi-VN":"Giao cầu","zh-CN":"发球","zh-TW":"發球"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"T","m":"none"},{"id":"d1","k":"player","l":"L","m":"none"},{"id":"d2","k":"player","l":"R","m":"none"},{"id":"d3","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"circle"},{"id":"m1","k":"marker","l":"","m":"zone"},{"i  ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A, 1, 2, 3 moves up the board, A, B, C moves back; Step 2: A plays it to 1.\nCoaching point: Three touches, three players, one rally. Take the block away and the attackers have to learn to place the ball instead of hitting it.","noteZh":"【组织】3 对 3，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A，1号球员、2号球员、3号球员向前移动，A、B、C回撤移动；第2步：A 打向 1号球员。\n【要点】三次触球，三个人，一个回合。把拦网去掉，进攻手就必须学会把球放到位置，而不是一味砸。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"development","minutes":15,"players":6,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"A","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_game_no_block","name":"Game with no block","nameZh":"对抗 不设拦网","note":"Setup: 3 v 3, 1 cones, ball with 1.\nBall path: 1 → A → 1\nSequence: Step 1: 1 plays it to A, 1, 2, 3 moves up the board, A, B, C moves back; Step 2: A plays it to 1.\nCoaching point: Three touches, three players, one rally. Take the block away and the attackers have to learn to place the ball instead of hitting it.","noteZh":"【组织】3 对 3，1 个锥标，球在 1 脚下。\n【球路】1 → A → 1\n【流程】第1步：1号球员 打向 A，1号球员、2号球员、3号球员向前移动，A、B、C回撤移动；第2步：A 打向 1号球员。\n【要点】三次触球，三个人，一个回合。把拦网去掉，进攻手就必须学会把球放到位置，而不是一味砸。","mistake":"Playing to win and forgetting the constraint that was the lesson.","mistakeZh":"只想赢，忘了那条作为课题的限制。","category":"ssg","level":"development","minutes":15,"players":6,"family":{"en":"Game","en-GB":"Game","es-ES":"Juego","fr-FR":"Jeu","id-ID":"Permainan","ja-JP":"ゲーム","ko-KR":"게임","ms-MY":"Permainan","th-TH":"เกม","vi-VN":"Trận đấu","zh-CN":"对抗","zh-TW":"對抗"},"tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"A","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"C","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_block_at_the_net","name":"Defending blocking at the net","nameZh":"防守 网前拦网","note":"Setup: 2 v 2.\nBall path: S → B\nSequence: Step 1: the ball is played to S, F moves back; Step 2: S plays it to B, B moves up the board, S moves back; Step 3: C moves left.\nCoaching point: Turn your back and take it on the shoulder or the back — not the chest, which sends it straight down on your own side. Jump on his hip, not on the ball.","noteZh":"【组织】2 对 2。\n【球路】S → B\n【流程】第1步：球被传给S，F回撤移动；第2步：S 打向 B，B向前移动，S回撤移动；第3步：C向左移动。\n【要点】转身用肩或背去挡，不要用胸——胸挡会把球直接砸回自己半场。看他的髋起跳，不是看球起跳。","mistake":"Reacting to the ball instead of holding the position.","mistakeZh":"对着球做反应，而不是守住位置。","category":"defending","level":"foundation","minutes":10,"players":4,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"B","m":"none"},{"id":"d1","k":"player","l":"C","m":"none"},{"id":"d2","k":"player","l":"S","m":"none"},{"id":"d3","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"sepakTakraw","id":"st_receive_header","name":"Serve receive with the head","nameZh":"接发球 用头处理","note":"Setup: 2 v 1.\nSequence: Step 1: T moves up the board; Step 2: R moves up the board; Step 3: F moves up the board.\nCoaching point: The head is one of the four surfaces, and the only one that can take a hard serve cleanly at chest height. Meet it with the forehead, moving forward, not with the top of the skull.","noteZh":"【组织】2 对 1。\n【流程】第1步：T向前移动；第2步：R向前移动；第3步：F向前移动。\n【要点】头是四个合法触球部位之一，也是唯一能在胸高干净地接住重发球的那个。要用前额、身体往前迎，不是用头顶。","mistake":"Taking the safe touch when the sharp one was on.","mistakeZh":"该处理得果断时选了保险的一下。","category":"possession","level":"foundation","minutes":10,"players":3,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"R","m":"none"},{"id":"d1","k":"player","l":"F","m":"none"},{"id":"d2","k":"player","l":"T","m":"none"},{"id":"m0","k":"marker","l":"","m":"circle"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"rondo_4v2","name":"Rondo 4v2","nameZh":"4v2 抢圈","note":"Setup: 4 v 2, 4 cones, ball with 1.\nBall path: 1 → 2 → 3 → 4\nSequence: Step 1: 1 passes to 2, 1 moves back, A moves right; Step 2: 2 passes to 3, 2 moves back, B moves left; Step 3: 3 passes to 4, 3 moves up the board; Step 4: 4 moves up the board.\nCoaching point: Two touches. The pass that breaks the line is the one through the middle — look for it before playing round.","noteZh":"【组织】4 对 2，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 3 → 4\n【流程】第1步：1号球员把球传给2号球员，1号球员回撤移动，A向右移动；第2步：2号球员把球传给3号球员，2号球员回撤移动，B向左移动；第3步：3号球员把球传给4号球员，3号球员向前移动；第4步：4号球员向前移动。\n【要点】限两脚触球。真正破防的是穿过中间那脚传球 —— 先找它，再考虑绕圈传。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"foundation","minutes":10,"players":6,"family":"","tags":[],"maxStep":4,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 3 步 A+B（相距 45）"}]},{"sport":"soccer","id":"passing_diamond","name":"Passing diamond","nameZh":"菱形传球","note":"Setup: 4 players, 4 cones, ball with 1.\nBall path: 1 → 2 → 3 → 4 → back to the start\nSequence: Step 1: 1 passes to 2; Step 2: 2 passes to 3, 1 runs up to take 2's position; Step 3: 3 passes to 4, 2 runs up to take 3's position; Step 4: 3 runs up to take 4's position, 4 plays the ball on; Step 5: 4 runs up to take 1's position.\nCoaching point: Pass and follow your pass. Open your body before the ball arrives so the next pass is already on.","noteZh":"【组织】4 人，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 3 → 4 → 回到起点\n【流程】第1步：1号球员把球传给2号球员；第2步：2号球员把球传给3号球员，1号球员跑位到2号球员的位置；第3步：3号球员把球传给4号球员，2号球员跑位到3号球员的位置；第4步：3号球员跑位到4号球员的位置，4号球员把球传到下一个点；第5步：4号球员跑位到1号球员的位置。\n【要点】传球后跟着球跑。球到之前先把身体打开，下一脚传球才接得上。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":8,"players":4,"family":"","tags":[],"maxStep":5,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"dribble_slalom","name":"Dribble slalom","nameZh":"绕杆运球","note":"Setup: 1 players, 4 cones, ball with 1.\nSequence: Step 1: 1 carries the ball on the move, 1 moves up the board.\nCoaching point: Small touches through the cones, then head up and one long touch into space.","noteZh":"【组织】1 人，4 个锥标，球在 1 脚下。\n【流程】第1步：1号球员带球推进，1号球员向前移动。\n【要点】过杆时小碎步触球，出杆后抬头，一脚大力推进空当。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":8,"players":1,"family":"","tags":[],"maxStep":4,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"possession_7v4","name":"7v4 possession","nameZh":"7v4 控球","note":"Setup: 7 v 4, 4 cones, ball with 1.\nBall path: 1 → 7 → 3\nSequence: Step 1: 1 passes to 7, 7, A moves right; Step 2: 7 passes to 3, 3 moves back, B moves right.\nCoaching point: Six passes then switch. The far side is only free while the ball travels — move it before they shift.","noteZh":"【组织】7 对 4，4 个锥标，球在 1 脚下。\n【球路】1 → 7 → 3\n【流程】第1步：1号球员把球传给7号球员，7号球员、A向右移动；第2步：7号球员把球传给3号球员，3号球员回撤移动，B向右移动。\n【要点】六脚传球后转移。球在运行时对面才是空的 —— 趁他们没横移过来就传。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"development","minutes":15,"players":11,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"6","m":"none"},{"id":"d6","k":"player","l":"7","m":"none"},{"id":"d7","k":"player","l":"A","m":"none"},{"id":"d8","k":"player","l":"B","m":"none"},{"id":"d9","k":"player","l":"C","m":"none"},{"id":"d10","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 7+B（相距 20）"}]},{"sport":"soccer","id":"overlap_wide","name":"Overlap and cross","nameZh":"边路套上传中","note":"Setup: 4 v 3, ball with 7.\nBall path: 7 → 2 → 9\nSequence: Step 1: 7 passes to 2, 2 moves up the board; Step 2: 7 runs up to take D's position, D moves up the board; Step 3: 2 carries the ball on the move, 10 moves up the board; Step 4: 2 passes to 9, 9 moves up the board.\nCoaching point: The winger holds until the full-back is past him — the defender can't watch both.","noteZh":"【组织】4 对 3，球在 7 脚下。\n【球路】7 → 2 → 9\n【流程】第1步：7号球员把球传给2号球员，2号球员向前移动；第2步：7号球员跑位到D的位置，D向前移动；第3步：2号球员带球推进，10号球员向前移动；第4步：2号球员把球传给9号球员，9号球员向前移动。\n【要点】边锋要等边后卫套过自己再放球 —— 防守球员盯不住两个人。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":12,"players":7,"family":"","tags":[],"maxStep":4,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"10","m":"none"},{"id":"d3","k":"player","l":"9","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"C","m":"none"},{"id":"d6","k":"player","l":"GK","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"third_man_run","name":"Third-man run","nameZh":"第三人跑动","note":"Setup: 3 v 1, ball with 6.\nBall path: 6 → 10 → 8\nSequence: Step 1: 6 passes to 10, 10, C moves back, 8 moves up the board; Step 2: 10 passes to 8.\nCoaching point: The runner starts before the second pass, not after. If he waits, the space is already gone.","noteZh":"【组织】3 对 1，球在 6 脚下。\n【球路】6 → 10 → 8\n【流程】第1步：6号球员把球传给10号球员，10号球员、C回撤移动，8号球员向前移动；第2步：10号球员把球传给8号球员。\n【要点】第三人要在第二脚传球之前启动，不是之后。等球到了，空当就没了。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":12,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"6","m":"none"},{"id":"d1","k":"player","l":"10","m":"none"},{"id":"d2","k":"player","l":"8","m":"none"},{"id":"d3","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"switch_play","name":"Switch the play","nameZh":"转移进攻","note":"Setup: 5 v 3, ball with 5.\nBall path: 5 → 6 → 7\nSequence: Step 1: 5 passes to 6, 3, 6 moves up the board, A, B, C moves left; Step 2: 6 passes to 7, 7 moves up the board.\nCoaching point: Draw them to one side first. A switch into a compact block just gives the ball away.","noteZh":"【组织】5 对 3，球在 5 脚下。\n【球路】5 → 6 → 7\n【流程】第1步：5号球员把球传给6号球员，3号球员、6号球员向前移动，A、B、C向左移动；第2步：6号球员把球传给7号球员，7号球员向前移动。\n【要点】先把对方拉到一边。对着密集防守转移，只是把球送出去。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":12,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"5","m":"none"},{"id":"d1","k":"player","l":"3","m":"none"},{"id":"d2","k":"player","l":"6","m":"none"},{"id":"d3","k":"player","l":"7","m":"none"},{"id":"d4","k":"player","l":"9","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"cutback_finish","name":"Cutback finish","nameZh":"倒三角射门","note":"Setup: 4 v 3, ball with 7.\nBall path: 7 → 10\nSequence: Step 1: 7 carries the ball on the move, 7 moves up the board; Step 2: 7 passes to 10, 9, 10, 8 moves up the board.\nCoaching point: Three runners: near post, penalty spot, edge of the box. The cutback goes behind the first.","noteZh":"【组织】4 对 3，球在 7 脚下。\n【球路】7 → 10\n【流程】第1步：7号球员带球推进，7号球员向前移动；第2步：7号球员把球传给10号球员，9号球员、10号球员、8号球员向前移动。\n【要点】三条跑动线路：近门柱、点球点、禁区弧顶。倒三角要传到第一个人身后。","mistake":"Placing when power was on, blasting when placement was — the finish reads the keeper, not the coach.","mistakeZh":"该发力时求角度，该求角度时猛轰——终结要读门将，不是读教练。","category":"finishing","level":"development","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"10","m":"none"},{"id":"d3","k":"player","l":"8","m":"none"},{"id":"d4","k":"player","l":"D","m":"none"},{"id":"d5","k":"player","l":"E","m":"none"},{"id":"d6","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"one_v_one_gk","name":"1v1 with the keeper","nameZh":"单刀对门将","note":"Setup: 1 v 1, ball with 9.\nBall path: 9 → goal\nSequence: Step 1: 9 carries the ball on the move, 9 moves up the board; Step 2: GK moves back; Step 3: 9 shoots.\nCoaching point: Decide early: shot across the keeper, or take him out of it with one touch wide.","noteZh":"【组织】1 对 1，球在 9 脚下。\n【球路】9 → 球门\n【流程】第1步：9号球员带球推进，9号球员向前移动；第2步：GK回撤移动；第3步：9号球员起脚射门。\n【要点】早做决定：要么打门将远角，要么一脚推向侧面把他晃开。","mistake":"Placing when power was on, blasting when placement was — the finish reads the keeper, not the coach.","mistakeZh":"该发力时求角度，该求角度时猛轰——终结要读门将，不是读教练。","category":"finishing","level":"foundation","minutes":10,"players":2,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"9","m":"none"},{"id":"d1","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"press_trigger","name":"Pressing trigger","nameZh":"压迫触发点","note":"Setup: 4 v 3.\nBall path: 6\nSequence: Step 1: the ball is played to 6, 6 moves up the board; Step 2: 9, 11, 7, 8 moves up the board.\nCoaching point: The trigger is a pass backwards or a bad first touch. First man closes the ball, the rest close the passing lanes.","noteZh":"【组织】4 对 3。\n【球路】6\n【流程】第1步：球被传给6号球员，6号球员向前移动；第2步：9号球员、11号球员、7号球员、8号球员向前移动。\n【要点】触发点是回传球或一次糟糕的停球。第一个人上抢球，其余人封传球路线。","mistake":"Reaching with a leg instead of moving the feet — the tackle you lunge for is the one you miss.","mistakeZh":"用腿去够而不是挪脚——扑出去抢的那一下，正是你抢不到的那一下。","category":"defending","level":"development","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"9","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"8","m":"none"},{"id":"d4","k":"player","l":"6","m":"none"},{"id":"d5","k":"player","l":"5","m":"none"},{"id":"d6","k":"player","l":"4","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_2v2","name":"2v2 recovery","nameZh":"2v2 回追防守","note":"Setup: 2 v 2.\nBall path: 9 → 10\nSequence: Step 1: the ball is played to 9, 4 moves back, 9 moves up the board; Step 2: 9 passes to 10, 5 moves back, 10 moves up the board.\nCoaching point: First defender delays, second covers the inside. Never both at the ball.","noteZh":"【组织】2 对 2。\n【球路】9 → 10\n【流程】第1步：球被传给9号球员，4号球员回撤移动，9号球员向前移动；第2步：9号球员把球传给10号球员，5号球员回撤移动，10号球员向前移动。\n【要点】第一防守人延缓，第二人保护内侧。两个人不能同时扑球。","mistake":"Reaching with a leg instead of moving the feet — the tackle you lunge for is the one you miss.","mistakeZh":"用腿去够而不是挪脚——扑出去抢的那一下，正是你抢不到的那一下。","category":"defending","level":"development","minutes":12,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"4","m":"none"},{"id":"d1","k":"player","l":"5","m":"none"},{"id":"d2","k":"player","l":"9","m":"none"},{"id":"d3","k":"player","l":"10","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"corner_near_post","name":"Corner: near post","nameZh":"角球：近门柱","note":"Setup: 5 v 4, ball with 7.\nBall path: 7 → 9 → goal\nSequence: Step 1: 7 passes to 9, 9, 5, 6 moves up the board; Step 2: 9 shoots, 8 moves up the board.\nCoaching point: Two decoys pull the markers back, the near-post runner attacks the ball in front of them.","noteZh":"【组织】5 对 4，球在 7 脚下。\n【球路】7 → 9 → 球门\n【流程】第1步：7号球员把球传给9号球员，9号球员、5号球员、6号球员向前移动；第2步：9号球员起脚射门，8号球员向前移动。\n【要点】两个人做诱饵把盯人拉向后点，近门柱的人从他们身前抢点。","mistake":"Improvising a rehearsed moment — the whole value of a set piece is that it was decided beforehand.","mistakeZh":"把排练好的时刻临场发挥——定位球的全部价值，就在于它是事先定好的。","category":"setpiece","level":"development","minutes":10,"players":9,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"6","m":"none"},{"id":"d4","k":"player","l":"8","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"d8","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 9+A（相距 40）"}]},{"sport":"soccer","id":"free_kick_edge","name":"Free kick: edge of the box","nameZh":"禁区前任意球","note":"Setup: 3 v 5, ball with 10.\nBall path: 10 → 8 → goal\nSequence: Step 1: 10 passes to 8, 7, 8 moves up the board; Step 2: 8 shoots.\nCoaching point: Two over the ball. The runner across the wall is the shot; the strike is the decoy as often as not.","noteZh":"【组织】3 对 5，球在 10 脚下。\n【球路】10 → 8 → 球门\n【流程】第1步：10号球员把球传给8号球员，7号球员、8号球员向前移动；第2步：8号球员起脚射门。\n【要点】两人站位。横穿人墙的跑动才是主攻手，直接射门往往只是幌子。","mistake":"Improvising a rehearsed moment — the whole value of a set piece is that it was decided beforehand.","mistakeZh":"把排练好的时刻临场发挥——定位球的全部价值，就在于它是事先定好的。","category":"setpiece","level":"development","minutes":10,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"10","m":"none"},{"id":"d1","k":"player","l":"7","m":"none"},{"id":"d2","k":"player","l":"8","m":"none"},{"id":"d3","k":"player","l":"W1","m":"none"},{"id":"d4","k":"player","l":"W2","m":"none"},{"id":"d5","k":"player","l":"W3","m":"none"},{"id":"d6","k":"player","l":"W4","m":"none"},{"id":"d7","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 8+W3（相距 29）；第 1 步 8+W4（相距 59）"}]},{"sport":"soccer","id":"ssg_4v4_four_goals","name":"4v4, four goals","nameZh":"4v4 四门球","note":"Setup: 4 v 4, 4 cones, ball with 1.\nBall path: 1 → 2 → 4\nSequence: Step 1: 1 passes to 2, 1 moves up the board, A moves back; Step 2: 2 passes to 4, 4 moves up the board.\nCoaching point: Two goals each forces a switch: attack the one they left open, not the one in front of you.","noteZh":"【组织】4 对 4，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 4\n【流程】第1步：1号球员把球传给2号球员，1号球员向前移动，A回撤移动；第2步：2号球员把球传给4号球员，4号球员向前移动。\n【要点】每队两个球门，逼着你转移：攻他们放空的那个，不是眼前那个。","mistake":"Playing the game and forgetting the constraint — the rule is the lesson, not an obstacle.","mistakeZh":"只顾比赛忘了限制条件——那条规则才是课题，不是障碍。","category":"ssg","level":"development","minutes":20,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"d6","k":"player","l":"C","m":"none"},{"id":"d7","k":"player","l":"D","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"square"},{"id":"m2","k":"marker","l":"","m":"square"},{"id":"m3","k":"marker","l":"","m":"square"},{"id":"m4","k":"marker","l":"","m":"cone"},{"id":"m5","k":"marker","l":"","m":"cone"},{"id":"m6","k":"marker","l":"","m":"cone"},{"id":"m7","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 1+A（相距 28）；第 2 步 1+A（相距 28）"}]},{"sport":"soccer","id":"warmup_y_pattern","name":"Y-pattern passing","nameZh":"Y 字传球","note":"Setup: 4 players, 4 cones, ball with 1.\nBall path: 1 → 2 → 3\nSequence: Step 1: 1 passes to 2, 1 moves up the board, 2 moves back; Step 2: 2 passes to 3, 3, 4 moves up the board.\nCoaching point: Set, back, spread. The lay-off is one touch or the pattern stalls.","noteZh":"【组织】4 人，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 3\n【流程】第1步：1号球员把球传给2号球员，1号球员向前移动，2号球员回撤移动；第2步：2号球员把球传给3号球员，3号球员、4号球员向前移动。\n【要点】做球、回做、分边。回做必须一脚出球，否则节奏就断了。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":8,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 1+2（相距 50）；第 2 步 1+2（相距 50）"}]},{"sport":"soccer","id":"warmup_first_touch_gate","name":"First-touch gates","nameZh":"停球过门","note":"Setup: 2 players, 6 cones, ball with 1.\nSequence: Step 1: 1 carries the ball on the move, 1 moves right.\nCoaching point: Receive across your body so the first touch already faces the next gate.","noteZh":"【组织】2 人，6 个锥标，球在 1 脚下。\n【流程】第1步：1号球员带球推进，1号球员向右移动。\n【要点】侧身接球，第一脚就把球停向下一个门 —— 别停完再转身。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":8,"players":2,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"m4","k":"marker","l":"","m":"cone"},{"id":"m5","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"rondo_5v2_split","name":"Rondo 5v2 — split pass","nameZh":"5v2 抢圈：穿裆直塞","note":"Setup: 5 v 2, 5 cones, ball with 1.\nBall path: 1 → 3 → 5\nSequence: Step 1: 1 passes to 3, 1 moves right, A moves up the board; Step 2: 3 passes to 5, 3 moves left, B moves up the board.\nCoaching point: A pass between the two defenders counts double. It only exists for a moment after they step.","noteZh":"【组织】5 对 2，5 个锥标，球在 1 脚下。\n【球路】1 → 3 → 5\n【流程】第1步：1号球员把球传给3号球员，1号球员向右移动，A向前移动；第2步：3号球员把球传给5号球员，3号球员向左移动，B向前移动。\n【要点】从两个防守人之间穿过算两分。那条线只在他们上抢的一瞬间存在。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"development","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"m4","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"possession_3_zone","name":"Three-zone possession","nameZh":"三区控球","note":"Setup: 5 v 2, ball with 1.\nBall path: 1 → 3 → 5\nSequence: Step 1: 1 passes to 3, 1 moves up the board, 3 moves right, A moves back; Step 2: 3 passes to 5, 5, B moves back.\nCoaching point: You can only score by playing through the middle zone, never around it.","noteZh":"【组织】5 对 2，球在 1 脚下。\n【球路】1 → 3 → 5\n【流程】第1步：1号球员把球传给3号球员，1号球员向前移动，3号球员向右移动，A回撤移动；第2步：3号球员把球传给5号球员，5号球员、B回撤移动。\n【要点】只有球穿过中间区才算得分 —— 绕过去不算。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"advanced","minutes":15,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"zone"},{"id":"m1","k":"marker","l":"","m":"zone"},{"id":"m2","k":"marker","l":"","m":"zone"},{"id":"m3","k":"marker","l":"","m":"zone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"build_from_gk","name":"Building from the keeper","nameZh":"门将脚下出球","note":"Setup: 6 v 2, ball with GK.\nBall path: GK → 4 → 3\nSequence: Step 1: GK passes to 4, 4, 9 moves left, 5 moves right; Step 2: 4 passes to 3, 6, 3, 2 moves up the board, 10 moves left.\nCoaching point: Centre-backs split wide of the box first. If they stay close, the keeper has no angle to play.","noteZh":"【组织】6 对 2，球在 GK 脚下。\n【球路】GK → 4 → 3\n【流程】第1步：GK把球传给4号球员，4号球员、9号球员向左移动，5号球员向右移动；第2步：4号球员把球传给3号球员，6号球员、3号球员、2号球员向前移动，10号球员向左移动。\n【要点】中卫先拉开到禁区两侧。站得太近，门将根本没有出球角度。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"advanced","minutes":15,"players":8,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"GK","m":"none"},{"id":"d1","k":"player","l":"4","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"6","m":"none"},{"id":"d4","k":"player","l":"3","m":"none"},{"id":"d5","k":"player","l":"2","m":"none"},{"id":"d6","k":"player","l":"9","m":"none"},{"id":"d7","k":"player","l":"10","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"wall_pass_wide","name":"Wall pass on the wing","nameZh":"边路撞墙配合","note":"Setup: 2 v 1, ball with 7.\nBall path: 7 → 10 → 7\nSequence: Step 1: 7 passes to 10, 7, 10, D moves up the board; Step 2: 10 passes to 7.\nCoaching point: Run past the defender before you pass, not after — the wall player returns it into space, not to feet.","noteZh":"【组织】2 对 1，球在 7 脚下。\n【球路】7 → 10 → 7\n【流程】第1步：7号球员把球传给10号球员，7号球员、10号球员、D向前移动；第2步：10号球员把球传给7号球员。\n【要点】先启动再出球，不是传完才跑 —— 墙的回球要送到空当，不是脚下。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"foundation","minutes":10,"players":3,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"10","m":"none"},{"id":"d2","k":"player","l":"D","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 7+D（相距 50）"}]},{"sport":"soccer","id":"counter_3v2","name":"3v2 counter","nameZh":"3v2 快速反击","note":"Setup: 3 v 2, ball with 9.\nBall path: 9 → 11\nSequence: Step 1: 9 carries the ball on the move, 9, 11, 7 moves up the board; Step 2: 9 carries the ball on the move, 4 moves right; Step 3: 9 passes to 11, 5 moves up the board.\nCoaching point: Carry until a defender commits, then release. Passing early turns 3v2 back into 3v3.","noteZh":"【组织】3 对 2，球在 9 脚下。\n【球路】9 → 11\n【流程】第1步：9号球员带球推进，9号球员、11号球员、7号球员向前移动；第2步：9号球员带球推进，4号球员向右移动；第3步：9号球员把球传给11号球员，5号球员向前移动。\n【要点】带球逼到有人上抢再出球。传早了，3打2 就又变回 3打3。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":12,"players":5,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"9","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 3 步 9+5（相距 60）"}]},{"sport":"soccer","id":"halfspace_run","name":"Half-space run","nameZh":"肋部插上","note":"Setup: 3 v 2, ball with 6.\nBall path: 6 → 8 → goal\nSequence: Step 1: 6 passes to 8, 6, 8, 3 moves up the board; Step 2: 8 carries the ball on the move, 4 moves right; Step 3: 8 shoots.\nCoaching point: The winger holds the full-back wide; the run goes inside him, behind the centre-back.","noteZh":"【组织】3 对 2，球在 6 脚下。\n【球路】6 → 8 → 球门\n【流程】第1步：6号球员把球传给8号球员，6号球员、8号球员、3号球员向前移动；第2步：8号球员带球推进，4号球员向右移动；第3步：8号球员起脚射门。\n【要点】边锋把边后卫钉在外侧，插上路线走他内侧、中卫身后。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":12,"players":5,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"6","m":"none"},{"id":"d1","k":"player","l":"7","m":"none"},{"id":"d2","k":"player","l":"8","m":"none"},{"id":"d3","k":"player","l":"3","m":"none"},{"id":"d4","k":"player","l":"4","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"finish_first_time","name":"First-time finishing","nameZh":"一脚打门","note":"Setup: 3 v 1, ball with 11.\nBall path: 11 → 9 → goal\nSequence: Step 1: 11 passes to 9, 11, 9 moves up the board; Step 2: 9 shoots, GK moves left; Step 3: 7 moves up the board.\nCoaching point: Body over the ball, side foot, low into the corner. Power is not the problem — placement is.","noteZh":"【组织】3 对 1，球在 11 脚下。\n【球路】11 → 9 → 球门\n【流程】第1步：11号球员把球传给9号球员，11号球员、9号球员向前移动；第2步：9号球员起脚射门，GK向左移动；第3步：7号球员向前移动。\n【要点】身体压在球上，脚内侧推射死角贴地。问题从来不是力量，是位置。","mistake":"Placing when power was on, blasting when placement was — the finish reads the keeper, not the coach.","mistakeZh":"该发力时求角度，该求角度时猛轰——终结要读门将，不是读教练。","category":"finishing","level":"foundation","minutes":10,"players":4,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"11","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"finish_turn_shoot","name":"Receive, turn, shoot","nameZh":"接球转身射门","note":"Setup: 2 v 2, ball with 10.\nBall path: 10 → 9 → goal\nSequence: Step 1: 10 passes to 9, 10, 9, 4 moves up the board; Step 2: 9 shoots.\nCoaching point: Check your shoulder before the ball comes. If the defender is tight, the turn is away from him, not through him.","noteZh":"【组织】2 对 2，球在 10 脚下。\n【球路】10 → 9 → 球门\n【流程】第1步：10号球员把球传给9号球员，10号球员、9号球员、4号球员向前移动；第2步：9号球员起脚射门。\n【要点】球来之前先看肩后。防守贴得紧就朝反方向转，别硬顶。","mistake":"Placing when power was on, blasting when placement was — the finish reads the keeper, not the coach.","mistakeZh":"该发力时求角度，该求角度时猛轰——终结要读门将，不是读教练。","category":"finishing","level":"foundation","minutes":10,"players":4,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"10","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_shape_shift","name":"Back four: shift and cover","nameZh":"后防四人：横移与保护","note":"Setup: 4 v 3.\nBall path: 10 → 7\nSequence: Step 1: the ball is played to 10, 10 passes to 7, 3, 4, 5, 2, 10, 7 moves right.\nCoaching point: The far full-back tucks in as the ball travels. The line moves as one — a gap is one player being late.","noteZh":"【组织】4 对 3。\n【球路】10 → 7\n【流程】第1步：球被传给10号球员，10号球员把球传给7号球员，3号球员、4号球员、5号球员、2号球员、10号球员、7号球员向右移动。\n【要点】球在运行时，远端边后卫要收进来。整条线一起动 —— 出现空当，就是有人慢了半拍。","mistake":"Reaching with a leg instead of moving the feet — the tackle you lunge for is the one you miss.","mistakeZh":"用腿去够而不是挪脚——扑出去抢的那一下，正是你抢不到的那一下。","category":"defending","level":"advanced","minutes":12,"players":7,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"3","m":"none"},{"id":"d1","k":"player","l":"4","m":"none"},{"id":"d2","k":"player","l":"5","m":"none"},{"id":"d3","k":"player","l":"2","m":"none"},{"id":"d4","k":"player","l":"11","m":"none"},{"id":"d5","k":"player","l":"10","m":"none"},{"id":"d6","k":"player","l":"7","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_counter_press","name":"Counter-press on loss","nameZh":"丢球后立刻反抢","note":"Setup: 4 v 3.\nBall path: 5\nSequence: Step 1: 8, 10, 7, 6 moves up the board; Step 2: the ball is played to 5, 5 moves up the board.\nCoaching point: Five seconds. Closest player to the ball goes, the rest cut the forward pass — nobody runs home yet.","noteZh":"【组织】4 对 3。\n【球路】5\n【流程】第1步：8号球员、10号球员、7号球员、6号球员向前移动；第2步：球被传给5号球员，5号球员向前移动。\n【要点】五秒钟。离球最近的人上抢，其余人切断向前的传球线 —— 谁都先别回撤。","mistake":"Reaching with a leg instead of moving the feet — the tackle you lunge for is the one you miss.","mistakeZh":"用腿去够而不是挪脚——扑出去抢的那一下，正是你抢不到的那一下。","category":"defending","level":"advanced","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"8","m":"none"},{"id":"d1","k":"player","l":"10","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"6","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"2","m":"none"},{"id":"d6","k":"player","l":"3","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 1 步 8+5（相距 20）"}]},{"sport":"soccer","id":"corner_short","name":"Corner: short routine","nameZh":"角球：短角球配合","note":"Setup: 5 v 4, ball with 7.\nBall path: 7 → 8 → 9\nSequence: Step 1: 7 passes to 8, 7 moves back, 8 moves up the board, A moves right; Step 2: 8 passes to 9, 9, 5, 6 moves up the board.\nCoaching point: Two out drags one marker. The cross now comes from a better angle with one defender fewer in the box.","noteZh":"【组织】5 对 4，球在 7 脚下。\n【球路】7 → 8 → 9\n【流程】第1步：7号球员把球传给8号球员，7号球员回撤移动，8号球员向前移动，A向右移动；第2步：8号球员把球传给9号球员，9号球员、5号球员、6号球员向前移动。\n【要点】两人出角把一个盯人拉出来。传中角度更好，禁区里还少了一个防守人。","mistake":"Improvising a rehearsed moment — the whole value of a set piece is that it was decided beforehand.","mistakeZh":"把排练好的时刻临场发挥——定位球的全部价值，就在于它是事先定好的。","category":"setpiece","level":"development","minutes":8,"players":9,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"8","m":"none"},{"id":"d2","k":"player","l":"9","m":"none"},{"id":"d3","k":"player","l":"5","m":"none"},{"id":"d4","k":"player","l":"6","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"d8","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"3 处球员重叠：第 1 步 7+8（相距 58）；第 2 步 7+8（相距 58）；第 2 步 6+C（相距 46）"}]},{"sport":"soccer","id":"throw_in_third","name":"Attacking throw-in","nameZh":"前场界外球","note":"Setup: 4 v 2, ball with 2.\nBall path: 2 → 7 → 9\nSequence: Step 1: 2 passes to 7, 7 moves up the board, A moves right; Step 2: 7 passes to 9, 9, 10 moves up the board, B moves right.\nCoaching point: One player checks in to drag his marker, another goes long. The throw is to the space, not the crowd.","noteZh":"【组织】4 对 2，球在 2 脚下。\n【球路】2 → 7 → 9\n【流程】第1步：2号球员把球传给7号球员，7号球员向前移动，A向右移动；第2步：7号球员把球传给9号球员，9号球员、10号球员向前移动，B向右移动。\n【要点】一个人回撤把盯防拉出来，另一个反跑深处。球扔向空当，不是人堆。","mistake":"Improvising a rehearsed moment — the whole value of a set piece is that it was decided beforehand.","mistakeZh":"把排练好的时刻临场发挥——定位球的全部价值，就在于它是事先定好的。","category":"setpiece","level":"development","minutes":8,"players":6,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"2","m":"none"},{"id":"d1","k":"player","l":"7","m":"none"},{"id":"d2","k":"player","l":"9","m":"none"},{"id":"d3","k":"player","l":"10","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 1 步 7+A（相距 42）；第 2 步 7+A（相距 42）"}]},{"sport":"soccer","id":"ssg_6v6_transition","name":"6v6 transition game","nameZh":"6v6 攻防转换","note":"Setup: 6 v 6, ball with 1.\nBall path: 1 → 5 → 3\nSequence: Step 1: 1 passes to 5, 1 moves up the board, A moves back; Step 2: 5 passes to 3, 3, 5 moves up the board.\nCoaching point: Score within 10 seconds of winning it back. The first pass after the turnover decides the attack.","noteZh":"【组织】6 对 6，球在 1 脚下。\n【球路】1 → 5 → 3\n【流程】第1步：1号球员把球传给5号球员，1号球员向前移动，A回撤移动；第2步：5号球员把球传给3号球员，3号球员、5号球员向前移动。\n【要点】抢断后 10 秒内完成射门。转换后的第一脚传球决定这次进攻。","mistake":"Playing the game and forgetting the constraint — the rule is the lesson, not an obstacle.","mistakeZh":"只顾比赛忘了限制条件——那条规则才是课题，不是障碍。","category":"ssg","level":"advanced","minutes":20,"players":12,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"6","m":"none"},{"id":"d6","k":"player","l":"A","m":"none"},{"id":"d7","k":"player","l":"B","m":"none"},{"id":"d8","k":"player","l":"C","m":"none"},{"id":"d9","k":"player","l":"D","m":"none"},{"id":"d10","k":"player","l":"E","m":"none"},{"id":"d11","k":"player","l":"F","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"warmup_rotation_square","name":"Rotation square","nameZh":"轮转方阵","note":"Setup: 4 players, 4 cones, ball with 1.\nBall path: 1 → 2 → 3 → 4 → back to the start\nSequence: Step 1: 1 passes to 2; Step 2: 2 passes to 3, 1 runs up to take 2's position; Step 3: 3 passes to 4, 2 runs up to take 3's position; Step 4: 3 runs up to take 4's position, 4 plays the ball on; Step 5: 4 runs up to take 1's position.\nCoaching point: Take the place of the player you passed to. Talk before the pass, not after it.","noteZh":"【组织】4 人，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 3 → 4 → 回到起点\n【流程】第1步：1号球员把球传给2号球员；第2步：2号球员把球传给3号球员，1号球员跑位到2号球员的位置；第3步：3号球员把球传给4号球员，2号球员跑位到3号球员的位置；第4步：3号球员跑位到4号球员的位置，4号球员把球传到下一个点；第5步：4号球员跑位到1号球员的位置。\n【要点】传给谁就去补谁的位置。开口要在传球之前，不是之后。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":8,"players":4,"family":"","tags":[],"maxStep":5,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"warmup_two_ball","name":"Two-ball awareness","nameZh":"双球注意力","note":"Setup: 4 players, 4 cones, ball with 1.\nBall path: 1 → 2 → 4\nSequence: Step 1: 1 passes to 2, 2 passes to 4, 1 moves back, 2 moves left, 3 moves up the board, 4 moves right.\nCoaching point: Two balls moving at once. Look up between touches — you can't react to what you haven't seen.","noteZh":"【组织】4 人，4 个锥标，球在 1 脚下。\n【球路】1 → 2 → 4\n【流程】第1步：1号球员把球传给2号球员，2号球员把球传给4号球员，1号球员回撤移动，2号球员向左移动，3号球员向前移动，4号球员向右移动。\n【要点】两个球同时在转。触球间隙抬头看 —— 没看见的东西反应不了。","mistake":"Going through the motions cold — the warm-up sets the standard the session keeps.","mistakeZh":"身体没热开就敷衍了事——热身是什么质量，整堂课就是什么质量。","category":"warmup","level":"foundation","minutes":6,"players":4,"family":"","tags":[],"maxStep":1,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"possession_overload_4v2_plus","name":"Overload to isolate","nameZh":"以多打少再转弱侧","note":"Setup: 5 v 3, ball with 8.\nBall path: 8 → 3 → 10 → 7\nSequence: Step 1: 8 passes to 3, 8 moves back, 3 moves up the board, A, B moves left; Step 2: 3 passes to 10, 10 moves right, C moves left; Step 3: 10 passes to 7, 7 moves up the board.\nCoaching point: Overload one side until they commit, then the isolated winger is 1v1 with the whole flank.","noteZh":"【组织】5 对 3，球在 8 脚下。\n【球路】8 → 3 → 10 → 7\n【流程】第1步：8号球员把球传给3号球员，8号球员回撤移动，3号球员向前移动，A、B向左移动；第2步：3号球员把球传给10号球员，10号球员向右移动，C向左移动；第3步：10号球员把球传给7号球员，7号球员向前移动。\n【要点】一侧堆人逼对方倾斜，弱侧边锋就得到一整条边路的 1v1。","mistake":"Passing to feet when the pass into space was on — the safe ball keeps possession and goes nowhere.","mistakeZh":"有向前的空当却往脚下传——保险球留住了球权，却哪也没去。","category":"possession","level":"advanced","minutes":12,"players":8,"family":"","tags":[],"maxStep":3,"els":[{"id":"d0","k":"player","l":"6","m":"none"},{"id":"d1","k":"player","l":"8","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"10","m":"none"},{"id":"d4","k":"player","l":"7","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"2 处球员重叠：第 2 步 10+C（相距 45）；第 3 步 10+C（相距 45）"}]},{"sport":"soccer","id":"attack_double_pivot_switch","name":"Pivot switch","nameZh":"后腰转移","note":"Setup: 4 v 3, ball with 11.\nBall path: 11 → 6 → 7\nSequence: Step 1: 11 passes to 6, 11 moves up the board, 6 moves right, A, B moves left; Step 2: 6 passes to 7, 7 moves up the board, C moves right.\nCoaching point: Back to the pivot, then out. Playing backwards to go forwards is the fastest route on a packed side.","noteZh":"【组织】4 对 3，球在 11 脚下。\n【球路】11 → 6 → 7\n【流程】第1步：11号球员把球传给6号球员，11号球员向前移动，6号球员向右移动，A、B向左移动；第2步：6号球员把球传给7号球员，7号球员向前移动，C向右移动。\n【要点】回传后腰再转边。密集一侧，往回传才是最快的向前。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"advanced","minutes":12,"players":7,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"11","m":"none"},{"id":"d1","k":"player","l":"6","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"9","m":"none"},{"id":"d4","k":"player","l":"A","m":"none"},{"id":"d5","k":"player","l":"B","m":"none"},{"id":"d6","k":"player","l":"C","m":"none"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"1 处球员重叠：第 2 步 7+C（相距 51）"}]},{"sport":"soccer","id":"attack_cross_far_post","name":"Far-post cross","nameZh":"远门柱传中","note":"Setup: 3 v 3, ball with 11.\nBall path: 11 → 7\nSequence: Step 1: 11 carries the ball on the move, 11, A moves up the board; Step 2: 11 passes to 7, 9, 7 moves up the board, GK moves left.\nCoaching point: Attack the far post from behind the defender's shoulder — arriving late beats standing early.","noteZh":"【组织】3 对 3，球在 11 脚下。\n【球路】11 → 7\n【流程】第1步：11号球员带球推进，11号球员、A向前移动；第2步：11号球员把球传给7号球员，9号球员、7号球员向前移动，GK向左移动。\n【要点】从防守人肩后包抄远门柱 —— 晚到一步好过早早站住。","mistake":"Waiting for the perfect ball — the run made late is a run defended easily.","mistakeZh":"等一个完美的球——跑得晚的插上，防起来毫不费力。","category":"attacking","level":"development","minutes":10,"players":6,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"11","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"7","m":"none"},{"id":"d3","k":"player","l":"A","m":"none"},{"id":"d4","k":"player","l":"B","m":"none"},{"id":"d5","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"3 处球员重叠：第 1 步 11+A（相距 60）；第 2 步 11+A（相距 60）；第 2 步 9+B（相距 57）"}]},{"sport":"soccer","id":"finish_volley_side","name":"Side volley from the cutback","nameZh":"倒三角凌空侧射","note":"Setup: 2 v 1, ball with 7.\nBall path: 7 → 9 → goal\nSequence: Step 1: 7 passes to 9, 7, 9 moves up the board; Step 2: 9 shoots, GK moves right.\nCoaching point: Feet set before the ball arrives. Half a step late and the strike goes over every time.","noteZh":"【组织】2 对 1，球在 7 脚下。\n【球路】7 → 9 → 球门\n【流程】第1步：7号球员把球传给9号球员，7号球员、9号球员向前移动；第2步：9号球员起脚射门，GK向右移动。\n【要点】球到之前脚步就要站好。慢半步，球必然打飞。","mistake":"Placing when power was on, blasting when placement was — the finish reads the keeper, not the coach.","mistakeZh":"该发力时求角度，该求角度时猛轰——终结要读门将，不是读教练。","category":"finishing","level":"foundation","minutes":10,"players":3,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"7","m":"none"},{"id":"d1","k":"player","l":"9","m":"none"},{"id":"d2","k":"player","l":"GK","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"defend_1v1_channel","name":"1v1 defending in the channel","nameZh":"边路 1v1 防守","note":"Setup: 1 v 1, 2 cones.\nBall path: 11\nSequence: Step 1: the ball is played to 11, 3 moves back, 11 moves up the board; Step 2: 11 carries the ball on the move.\nCoaching point: Show him down the line, never inside. Approach fast, arrive slow, and stay on your toes.","noteZh":"【组织】1 对 1，2 个锥标。\n【球路】11\n【流程】第1步：球被传给11号球员，3号球员回撤移动，11号球员向前移动；第2步：11号球员带球推进。\n【要点】把他逼向边线，绝不放内切。快速接近、减速到位、重心在前脚掌。","mistake":"Reaching with a leg instead of moving the feet — the tackle you lunge for is the one you miss.","mistakeZh":"用腿去够而不是挪脚——扑出去抢的那一下，正是你抢不到的那一下。","category":"defending","level":"foundation","minutes":10,"players":2,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"3","m":"none"},{"id":"d1","k":"player","l":"11","m":"none"},{"id":"m0","k":"marker","l":"","m":"cone"},{"id":"m1","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"setpiece_defend_corner","name":"Defending a corner","nameZh":"角球防守","note":"Setup: 6 v 3.\nBall path: 5 → the open spot\nSequence: Step 1: the ball is played to 5, 4 moves right, 5, 6, 9, 10 moves up the board, GK moves back; Step 2: 5 plays the ball on.\nCoaching point: Two on the posts, one attacks the near-post ball, the rest mark space and start moving as the ball is struck.","noteZh":"【组织】6 对 3。\n【球路】5 → 空位\n【流程】第1步：球被传给5号球员，4号球员向右移动，5号球员、6号球员、9号球员、10号球员向前移动，GK回撤移动；第2步：5号球员把球传到下一个点。\n【要点】两人守门柱，一人前顶抢近点，其余人盯区域，球一开就动。","mistake":"Improvising a rehearsed moment — the whole value of a set piece is that it was decided beforehand.","mistakeZh":"把排练好的时刻临场发挥——定位球的全部价值，就在于它是事先定好的。","category":"setpiece","level":"advanced","minutes":10,"players":9,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"2","m":"none"},{"id":"d1","k":"player","l":"3","m":"none"},{"id":"d2","k":"player","l":"4","m":"none"},{"id":"d3","k":"player","l":"5","m":"none"},{"id":"d4","k":"player","l":"6","m":"none"},{"id":"d5","k":"player","l":"GK","m":"none"},{"id":"d6","k":"player","l":"7","m":"none"},{"id":"d7","k":"player","l":"9","m":"none"},{"id":"d8","k":"player","l":"10","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[{"id":"overlap","level":"warn","text":"8 处球员重叠：第 1 步 3+GK（相距 53）；第 1 步 4+9（相距 34）；第 1 步 5+GK（相距 28）；第 1 步 5+10（相距 57）；第 2 步 3+GK（相距 53）；第 2 步 4+9（相距 34）；第 2 步 5+GK（相距 28）；第 2 步 5+10（相距 57）"}]},{"sport":"soccer","id":"ssg_5v5_two_touch","name":"5v5, two touches","nameZh":"5v5 两脚触球","note":"Setup: 5 v 5, 4 cones, ball with 1.\nBall path: 1 → 3 → 5\nSequence: Step 1: 1 passes to 3, 1 moves up the board, A moves back; Step 2: 3 passes to 5, 3, 5 moves up the board.\nCoaching point: Two touches forces the scan before you receive. Nobody solves it with skill; they solve it by looking earlier.","noteZh":"【组织】5 对 5，4 个锥标，球在 1 脚下。\n【球路】1 → 3 → 5\n【流程】第1步：1号球员把球传给3号球员，1号球员向前移动，A回撤移动；第2步：3号球员把球传给5号球员，3号球员、5号球员向前移动。\n【要点】限两脚，逼你在接球前就观察。这不是靠技术解决的，是靠提前看。","mistake":"Playing the game and forgetting the constraint — the rule is the lesson, not an obstacle.","mistakeZh":"只顾比赛忘了限制条件——那条规则才是课题，不是障碍。","category":"ssg","level":"development","minutes":18,"players":10,"family":"","tags":[],"maxStep":2,"els":[{"id":"d0","k":"player","l":"1","m":"none"},{"id":"d1","k":"player","l":"2","m":"none"},{"id":"d2","k":"player","l":"3","m":"none"},{"id":"d3","k":"player","l":"4","m":"none"},{"id":"d4","k":"player","l":"5","m":"none"},{"id":"d5","k":"player","l":"A","m":"none"},{"id":"d6","k":"player","l":"B","m":"none"},{"id":"d7","k":"player","l":"C","m":"none"},{"id":"d8","k":"player","l":"D","m":"none"},{"id":"d9","k":"player","l":"E","m":"none"},{"id":"m0","k":"marker","l":"","m":"square"},{"id":"m1","k":"marker","l":"","m":"square"},{"id":"m2","k":"marker","l":"","m":"cone"},{"id":"m3","k":"marker","l":"","m":"cone"},{"id":"m4","k":"marker","l":"","m":"cone"},{"id":"m5","k":"marker","l":"","m":"cone"},{"id":"b0","k":"ball","l":"","m":"none"}],"issues":[]},{"sport":"soccer","id":"possession_switch_two_touch","name":"Long switch, first time","nameZh":"一脚长传转移","note":"Setup: 4 v 2, ball with 3.\nBall path: 3 → 6 → 2\nSequence: Step 1: 3 passes to 6, 3, 6 moves up the board, A, B moves left; Step 2: 6 passes to 2, 2 moves up the board.\nCoaching point: The receiver's first touch decides the switch — take it away from the pressure, then hit it.","noteZh":"【组织】4 对 2，球在 3 脚下。\n【球路】3 → 6 → 2\n【流程】第1步：3号球员把球传给6号球员，3号球员、6号球员向前移动，A、B向左移动；第2步：6号球员把球传给2号球员，2号球员向前移动。\n【要点】转移成
