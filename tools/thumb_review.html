<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/third_man_run" title="打开训练详情"><img src="thumb_png/soccer/third_man_run.png" alt=""></a><figcaption><b>第三人跑动</b><code>soccer · third_man_run</code><p>第三人要在第二脚传球之前启动，不是之后。等球到了，空当就没了。</p><small>12 分钟 · 4 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/switch_play" title="打开训练详情"><img src="thumb_png/soccer/switch_play.png" alt=""></a><figcaption><b>大范围转移</b><code>soccer · switch_play</code><p>先把对方拉到一边。对着密集防守转移，只是把球送出去。</p><small>12 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/cutback_finish" title="打开训练详情"><img src="thumb_png/soccer/cutback_finish.png" alt=""></a><figcaption><b>倒三角射门</b><code>soccer · cutback_finish</code><p>三条跑动线路：前点、点球点、禁区弧顶。倒三角要传到第一个人身后。</p><small>12 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/one_v_one_gk" title="打开训练详情"><img src="thumb_png/soccer/one_v_one_gk.png" alt=""></a><figcaption><b>单刀对门将</b><code>soccer · one_v_one_gk</code><p>早做决定：要么打门将远角，要么一脚推向侧面把他晃开。</p><small>10 分钟 · 2 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/press_trigger" title="打开训练详情"><img src="thumb_png/soccer/press_trigger.png" alt=""></a><figcaption><b>压迫触发点</b><code>soccer · press_trigger</code><p>触发点是回传球或一次糟糕的停球。第一个人上抢球，其余人封传球路线。</p><small>12 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/defend_2v2" title="打开训练详情"><img src="thumb_png/soccer/defend_2v2.png" alt=""></a><figcaption><b>回追防守 2v2</b><code>soccer · defend_2v2</code><p>第一防守人延缓，第二人保护内侧。两个人不能同时扑球。</p><small>12 分钟 · 4 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/corner_near_post" title="打开训练详情"><img src="thumb_png/soccer/corner_near_post.png" alt=""></a><figcaption><b>角球 前点</b><code>soccer · corner_near_post</code><p>两个人做诱饵把盯人拉向后点，前点的人从他们身前抢点。</p><small>10 分钟 · 9 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/free_kick_edge" title="打开训练详情"><img src="thumb_png/soccer/free_kick_edge.png" alt=""></a><figcaption><b>禁区前任意球</b><code>soccer · free_kick_edge</code><p>两人站位。横穿人墙的跑动才是主攻手，直接射门往往只是幌子。</p><small>10 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/ssg_4v4_four_goals" title="打开训练详情"><img src="thumb_png/soccer/ssg_4v4_four_goals.png" alt=""></a><figcaption><b>四门球 4v4</b><code>soccer · ssg_4v4_four_goals</code><p>每队两个球门，逼着你转移：攻他们放空的那个，不是眼前那个。</p><small>20 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/warmup_y_pattern" title="打开训练详情"><img src="thumb_png/soccer/warmup_y_pattern.png" alt=""></a><figcaption><b>Y 字传球</b><code>soccer · warmup_y_pattern</code><p>做球、回做、分边。回做必须一脚出球，否则节奏就断了。</p><small>8 分钟 · 5 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/warmup_first_touch_gate" title="打开训练详情"><img src="thumb_png/soccer/warmup_first_touch_gate.png" alt=""></a><figcaption><b>停球过门</b><code>soccer · warmup_first_touch_gate</code><p>侧身接球，第一脚就把球停向下一个门 —— 别停完再转身。</p><small>8 分钟 · 2 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/rondo_5v2_split" title="打开训练详情"><img src="thumb_png/soccer/rondo_5v2_split.png" alt=""></a><figcaption><b>抢圈 5v2 · 穿越直塞</b><code>soccer · rondo_5v2_split</code><p>从两个防守人之间穿过算两分。那条线只在他们上抢的一瞬间存在。</p><small>12 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/possession_3_zone" title="打开训练详情"><img src="thumb_png/soccer/possession_3_zone.png" alt=""></a><figcaption><b>三区控球</b><code>soccer · possession_3_zone</code><p>只有球穿过中间区才算得分 —— 绕过去不算。</p><small>15 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/build_from_gk" title="打开训练详情"><img src="thumb_png/soccer/build_from_gk.png" alt=""></a><figcaption><b>门将脚下出球</b><code>soccer · build_from_gk</code><p>中卫先拉开到禁区两侧。站得太近，门将根本没有出球角度。</p><small>15 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/wall_pass_wide" title="打开训练详情"><img src="thumb_png/soccer/wall_pass_wide.png" alt=""></a><figcaption><b>边路撞墙配合</b><code>soccer · wall_pass_wide</code><p>二过一：先启动再出球，不是传完才跑 —— 墙的回球要送到空当，不是脚下。</p><small>10 分钟 · 3 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/counter_3v2" title="打开训练详情"><img src="thumb_png/soccer/counter_3v2.png" alt=""></a><figcaption><b>快速反击 3v2</b><code>soccer · counter_3v2</code><p>带球逼到有人上抢再出球。传早了，3打2 就又变回 3打3。</p><small>12 分钟 · 5 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/halfspace_run" title="打开训练详情"><img src="thumb_png/soccer/halfspace_run.png" alt=""></a><figcaption><b>肋部插上</b><code>soccer · halfspace_run</code><p>边锋把边后卫钉在外侧，插上路线走他内侧、中卫身后。</p><small>12 分钟 · 5 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/finish_first_time" title="打开训练详情"><img src="thumb_png/soccer/finish_first_time.png" alt=""></a><figcaption><b>一脚打门</b><code>soccer · finish_first_time</code><p>身体压在球上，脚内侧推射死角贴地。问题从来不是力量，是位置。</p><small>10 分钟 · 4 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/finish_turn_shoot" title="打开训练详情"><img src="thumb_png/soccer/finish_turn_shoot.png" alt=""></a><figcaption><b>接球转身射门</b><code>soccer · finish_turn_shoot</code><p>球来之前先看肩后。防守贴得紧就朝反方向转，别硬顶。</p><small>10 分钟 · 4 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/defend_shape_shift" title="打开训练详情"><img src="thumb_png/soccer/defend_shape_shift.png" alt=""></a><figcaption><b>后防四人 横移与保护</b><code>soccer · defend_shape_shift</code><p>球在运行时，远端边后卫要收进来。整条线一起动 —— 出现空当，就是有人慢了半拍。</p><small>12 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/defend_counter_press" title="打开训练详情"><img src="thumb_png/soccer/defend_counter_press.png" alt=""></a><figcaption><b>丢球后立刻反抢</b><code>soccer · defend_counter_press</code><p>五秒钟。离球最近的人上抢，其余人切断向前的传球线 —— 谁都先别回撤。</p><small>12 分钟 · 7 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/corner_short" title="打开训练详情"><img src="thumb_png/soccer/corner_short.png" alt=""></a><figcaption><b>角球 短角球</b><code>soccer · corner_short</code><p>两人出角把一个盯人拉出来。传中角度更好，禁区里还少了一个防守人。</p><small>8 分钟 · 9 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/throw_in_third" title="打开训练详情"><img src="thumb_png/soccer/throw_in_third.png" alt=""></a><figcaption><b>前场界外球</b><code>soccer · throw_in_third</code><p>一个人回撤把盯防拉出来，另一个反跑深处。球扔向空当，不是人堆。</p><small>8 分钟 · 6 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/ssg_6v6_transition" title="打开训练详情"><img src="thumb_png/soccer/ssg_6v6_transition.png" alt=""></a><figcaption><b>小场比赛 6v6 · 攻防转换</b><code>soccer · ssg_6v6_transition</code><p>抢断后 10 秒内完成射门。转换后的第一脚传球决定这次进攻。</p><small>20 分钟 · 12 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/warmup_rotation_square" title="打开训练详情"><img src="thumb_png/soccer/warmup_rotation_square.png" alt=""></a><figcaption><b>轮转方阵</b><code>soccer · warmup_rotation_square</code><p>传给谁就去补谁的位置。开口要在传球之前，不是之后。</p><small>8 分钟 · 5 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/warmup_two_ball" title="打开训练详情"><img src="thumb_png/soccer/warmup_two_ball.png" alt=""></a><figcaption><b>双球注意力</b><code>soccer · warmup_two_ball</code><p>两个球同时在转。触球间隙抬头看 —— 没看见的东西反应不了。</p><small>6 分钟 · 4 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/possession_overload_4v2_plus" title="打开训练详情"><img src="thumb_png/soccer/possession_overload_4v2_plus.png" alt=""></a><figcaption><b>以多打少再转弱侧</b><code>soccer · possession_overload_4v2_plus</code><p>一侧堆人逼对方倾斜，弱侧边锋就得到一整条边路的 1v1。</p><small>12 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/attack_double_pivot_switch" title="打开训练详情"><img src="thumb_png/soccer/attack_double_pivot_switch.png" alt=""></a><figcaption><b>后腰转移</b><code>soccer · attack_double_pivot_switch</code><p>回传后腰再转边。密集一侧，往回传才是最快的向前。</p><small>12 分钟 · 8 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/attack_cross_far_post" title="打开训练详情"><img src="thumb_png/soccer/attack_cross_far_post.png" alt=""></a><figcaption><b>后点传中</b><code>soccer · attack_cross_far_post</code><p>从防守人肩后包抄后点 —— 晚到一步好过早早站住。</p><small>10 分钟 · 6 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/finish_volley_side" title="打开训练详情"><img src="thumb_png/soccer/finish_volley_side.png" alt=""></a><figcaption><b>倒三角侧身凌空</b><code>soccer · finish_volley_side</code><p>球到之前脚步就要站好。慢半步，球必然打飞。</p><small>10 分钟 · 3 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/defend_1v1_channel" title="打开训练详情"><img src="thumb_png/soccer/defend_1v1_channel.png" alt=""></a><figcaption><b>边路 1v1 防守</b><code>soccer · defend_1v1_channel</code><p>把他逼向边线，绝不放内切。快速接近、减速到位、重心在前脚掌。</p><small>10 分钟 · 4 人</small></figcaption></figure>

<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/ssg_5v5_two_touch" title="打开训练详情"><img src="thumb_png/soccer/ssg_5v5_two_touch.png" alt=""></a><figcaption><b>小场比赛 5v5 · 两次触球</b><code>soccer · ssg_5v5_two_touch</code><p>限两脚，逼你在接球前就观察。这不是靠技术解决的，是靠提前看。</p><small>18 分钟 · 10 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/possession_switch_two_touch" title="打开训练详情"><img src="thumb_png/soccer/possession_switch_two_touch.png" alt=""></a><figcaption><b>一脚长传转移</b><code>soccer · possession_switch_two_touch</code><p>转移成不成，看接球第一脚 —— 先把球停离压迫方向，再打。</p><small>12 分钟 · 6 人</small></figcaption></figure>
<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/finish_penalty_routine" title="打开训练详情"><img src="thumb_png/soccer/finish_penalty_routine.png" alt=""></a><figcaption><b>疲劳状态罚点球</b><code>soccer · finish_penalty_routine</code><p>先冲刺一趟再罚。上前之前就选好角度，然后绝不改主意。</p><small>8 分钟 · 2 人</small></figcaption></figure>

<figure class="card" data-sport="soccer"><a href="drill_review.html?d=soccer/rondo_8v4" title="打开训练详情"><img src="thumb_png/soccer/rondo_8v4.png" alt=""></a><figcaption><b>抢圈 8v4</b><code>soccer · rondo_8v4</code><p>在压迫到位之前把球传走，不是之后。穿过中间那脚，抵得上外围两脚。</p><small>15 分钟 · 12 人</small></figcaption></figure>

<script>
  const chips = document.getElementById('chips');
  chips.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    for (const b of chips.querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b === btn));
    }
    const want = btn.dataset.filter;
    for (const card of document.querySelectorAll('.card')) {
      card.hidden = want && card.dataset.sport !== want;
    }
  });
  // ?sport=soccer opens the page already narrowed to one sport.
  const preset = new URLSearchParams(location.search).get('sport');
  if (preset) chips.querySelector(`button[data-filter="${preset}"]`)?.click();
</script>
