name: sport_fieldhockey
description: >-
  fieldHockey's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/fieldHockey.json
    - assets/icon/ball_fieldHockey.png
    - assets/icon/marker_stick.png
    - assets/icon/player_top_female_stick_base.png
    - assets/icon/player_top_female_stick_kit.png
    - assets/icon/player_top_male_stick_base.png
    - assets/icon/player_top_male_stick_kit.png
