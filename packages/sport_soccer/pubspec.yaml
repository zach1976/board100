name: sport_soccer
description: >-
  soccer's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/soccer.json
    - assets/icon/ball_soccer.png
    - assets/icon/goal_soccer_far.png
    - assets/icon/goal_soccer_near.png
