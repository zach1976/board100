name: sport_tennis
description: >-
  tennis's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/tennis.json
    - assets/icon/ball_tennis.png
    - assets/icon/marker_hopper.png
    - assets/icon/marker_net.png
    - assets/icon/marker_racket.png
    - assets/icon/player_top_female_racket_base.png
    - assets/icon/player_top_female_racket_kit.png
    - assets/icon/player_top_female_racket_turn_base.png
    - assets/icon/player_top_female_racket_turn_kit.png
    - assets/icon/player_top_male_racket_base.png
    - assets/icon/player_top_male_racket_kit.png
    - assets/icon/player_top_male_racket_turn_base.png
    - assets/icon/player_top_male_racket_turn_kit.png
