name: sport_footvolley
description: >-
  footvolley's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/footvolley.json
    - assets/icon/ball_footvolley.png
    - assets/icon/marker_antenna.png
    - assets/icon/marker_net.png
    - assets/icon/player_top_female_barefoot_base.png
    - assets/icon/player_top_female_barefoot_kit.png
    - assets/icon/player_top_female_barefoot_turn_base.png
    - assets/icon/player_top_female_barefoot_turn_kit.png
    - assets/icon/player_top_male_barefoot_base.png
    - assets/icon/player_top_male_barefoot_kit.png
    - assets/icon/player_top_male_barefoot_turn_base.png
    - assets/icon/player_top_male_barefoot_turn_kit.png
