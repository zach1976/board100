name: sport_waterpolo
description: >-
  waterPolo's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/waterPolo.json
    - assets/icon/ball_waterPolo.png
    - assets/icon/marker_floatinggoal.png
    - assets/icon/marker_lanerope.png
    - assets/icon/player_top_female_water_base.png
    - assets/icon/player_top_female_water_kit.png
    - assets/icon/player_top_female_water_turn_base.png
    - assets/icon/player_top_female_water_turn_kit.png
    - assets/icon/player_top_male_water_base.png
    - assets/icon/player_top_male_water_kit.png
    - assets/icon/player_top_male_water_turn_base.png
    - assets/icon/player_top_male_water_turn_kit.png
