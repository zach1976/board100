name: sport_baseball
description: >-
  baseball's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/baseball.json
    - assets/icon/ball_baseball.png
    - assets/icon/marker_base.png
    - assets/icon/marker_homeplate.png
    - assets/icon/marker_lscreen.png
    - assets/icon/marker_tee.png
    - assets/icon/player_top_female_bat_base.png
    - assets/icon/player_top_female_bat_kit.png
    - assets/icon/player_top_male_bat_base.png
    - assets/icon/player_top_male_bat_kit.png
