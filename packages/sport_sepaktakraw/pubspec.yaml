name: sport_sepaktakraw
description: >-
  sepakTakraw's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/sepakTakraw.json
    - assets/icon/ball_sepakTakraw.png
    - assets/icon/marker_antenna.png
    - assets/icon/marker_net.png
