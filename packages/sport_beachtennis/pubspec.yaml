name: sport_beachtennis
description: >-
  beachTennis's own assets: its drill library, its ball and the artwork no other
  sport can show. Generated by tools/gen_sport_packages.py — edit that, or
  the SportType getters it reads, never this file.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/drills/beachTennis.json
    - assets/icon/ball_beachTennis.png
    - assets/icon/marker_hopper.png
    - assets/icon/marker_net.png
    - assets/icon/marker_paddle.png
    - assets/icon/marker_racket.png
    - assets/icon/player_top_female_barefootPaddle_base.png
    - assets/icon/player_top_female_barefootPaddle_kit.png
    - assets/icon/player_top_female_barefootPaddle_turn_base.png
    - assets/icon/player_top_female_barefootPaddle_turn_kit.png
    - assets/icon/player_top_female_barefoot_base.png
    - assets/icon/player_top_female_barefoot_kit.png
    - assets/icon/player_top_female_barefoot_turn_base.png
    - assets/icon/player_top_female_barefoot_turn_kit.png
    - assets/icon/player_top_male_barefootPaddle_base.png
    - assets/icon/player_top_male_barefootPaddle_kit.png
    - assets/icon/player_top_male_barefootPaddle_turn_base.png
    - assets/icon/player_top_male_barefootPaddle_turn_kit.png
    - assets/icon/player_top_male_barefoot_base.png
    - assets/icon/player_top_male_barefoot_kit.png
    - assets/icon/player_top_male_barefoot_turn_base.png
    - assets/icon/player_top_male_barefoot_turn_kit.png
