name: hub_board
description: "Tactics Board — single-sport shell over the shared tactics_board core."
publish_to: 'none'
# Kept in lockstep with the core: every app in this repo ships one version.
version: 2.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # The whole app. This shell only picks the sport and hands over — see
  # lib/main.dart and tactics_board/lib/config_constants.dart.
  tactics_board:
    path: ../tactics_board
  # Only this app's sport(s): the drill library, the ball, the equipment.
  sport_badminton:
    path: ../packages/sport_badminton
  sport_baseball:
    path: ../packages/sport_baseball
  sport_basketball:
    path: ../packages/sport_basketball
  sport_beachtennis:
    path: ../packages/sport_beachtennis
  sport_fieldhockey:
    path: ../packages/sport_fieldhockey
  sport_footvolley:
    path: ../packages/sport_footvolley
  sport_handball:
    path: ../packages/sport_handball
  sport_pickleball:
    path: ../packages/sport_pickleball
  sport_rugby:
    path: ../packages/sport_rugby
  sport_sepaktakraw:
    path: ../packages/sport_sepaktakraw
  sport_soccer:
    path: ../packages/sport_soccer
  sport_tabletennis:
    path: ../packages/sport_tabletennis
  sport_tennis:
    path: ../packages/sport_tennis
  sport_volleyball:
    path: ../packages/sport_volleyball
  sport_waterpolo:
    path: ../packages/sport_waterpolo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/intro/

# Native icons/splash are generated ONCE (by tools/gen_sport_shell.sh) and
# committed, so a build never regenerates assets into another app's folders.
# The sources are this app's own assets/icon/ — no other app's artwork is
# reachable from here.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1E2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#1A3A4A"
  image: assets/icon/splash_logo.png
  ios_content_mode: scaleAspectFill
  android_gravity: fill
  android_12:
    color: "#1A3A4A"
    image: assets/icon/splash_logo.png
    icon_background_color: "#1A3A4A"
  fullscreen: true
  android: true
  ios: true
