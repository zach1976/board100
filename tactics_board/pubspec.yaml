name: tactics_board
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  easy_localization: ^3.0.7
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  http: ^1.2.0
  sign_in_with_apple: ^8.0.0
  google_sign_in: ^7.0.0
  crypto: ^3.0.6
  flutter_native_splash: ^2.4.7
  pdf: ^3.11.3
  printing: ^5.13.4
  image_picker: ^1.1.2
  image: ^4.2.0
  path: ^1.9.0
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  in_app_review: ^2.0.10
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_quick_video_encoder: ^1.7.2


dev_dependencies:
  # Every sport's package, so the test suite and tool/render_boards.dart can
  # load all fifteen drill libraries. dev_dependencies on purpose: pub
  # resolves them only when this package is the root, and Flutter bundles
  # their assets only under `flutter test` (asset.dart skips exclusive dev
  # dependencies in app builds). That is exactly the split wanted here —
  # a shell depending on tactics_board never inherits these, and the hub app
  # is its own shell (HubBoard/) that declares all fifteen for itself.
  sport_badminton:
    path: ../packages/sport_badminton
  sport_baseball:
    path: ../packages/sport_baseball
  sport_basketball:
    path: ../packages/sport_basketball
  sport_beachtennis:
    path: ../packages/sport_beachtennis
  sport_fieldhockey:
    path: ../packages/sport_fieldhockey
  sport_footvolley:
    path: ../packages/sport_footvolley
  sport_handball:
    path: ../packages/sport_handball
  sport_pickleball:
    path: ../packages/sport_pickleball
  sport_rugby:
    path: ../packages/sport_rugby
  sport_sepaktakraw:
    path: ../packages/sport_sepaktakraw
  sport_soccer:
    path: ../packages/sport_soccer
  sport_tabletennis:
    path: ../packages/sport_tabletennis
  sport_tennis:
    path: ../packages/sport_tennis
  sport_volleyball:
    path: ../packages/sport_volleyball
  sport_waterpolo:
    path: ../packages/sport_waterpolo
  # Read by test/widgets/marker_assets_test.dart, which checks every
  # marker sprite named in code is declared here and present on disk.
  yaml: ^3.1.2
  flutter_test:
    sdk: flutter
  # integration_test disabled for release: pulls fat objective_c.framework (App Store rejects simulator slice).
  # Re-enable (uncomment the two lines below) ONLY to run integration tests
  # locally — e.g. integration_test/ux_flows_test.dart — then re-comment before shipping.
  # integration_test:
  #   sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    # Only the in-app ball images are bundled at runtime. Bundling the whole
    # folder once shipped ~48MB of unused images in every app.
    # Per-sport assets — the drill libraries, the balls, the equipment only
    # some sports offer and the figures only some sports draw — are NOT here.
    # Flutter bundles everything a dependency declares, so anything the hub
    # needed was landing in all sixteen apps: a soccer build carried 13MB of
    # other sports' drills, a basketball hoop and a set of swim caps. They
    # live in packages/sport_<name>/ now; see tools/gen_sport_packages.py.
    - assets/icon/marker_cone.png
    - assets/icon/marker_ladder.png
    - assets/icon/marker_hurdle.png
    - assets/icon/marker_referee.png
    - assets/icon/marker_coach.png
    - assets/icon/marker_goal.png
    - assets/icon/marker_minigoal.png
    - assets/icon/marker_mannequin.png
    - assets/icon/marker_pole.png
    - assets/icon/marker_disc.png
    - assets/icon/marker_ring.png
    - assets/icon/marker_rebounder.png
    - assets/icon/marker_bench.png
    - assets/icon/marker_ballbag.png
    - assets/icon/marker_flag.png
    # The two figures every player token is drawn from, tinted to the
    # team colour at draw time.
    - assets/icon/player_top_male_base.png
    - assets/icon/player_top_male_kit.png
    - assets/icon/player_top_female_base.png
    - assets/icon/player_top_female_kit.png
    - assets/icon/empty_history.png
    - assets/icon/empty_mine.png
    - assets/icon/empty_search.png
    - assets/icon/paywall_banner.jpg

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# No flutter_launcher_icons / flutter_native_splash here: this is the
# library. The hub's icon and splash are generated in HubBoard/, the same
# way as every other app's.
